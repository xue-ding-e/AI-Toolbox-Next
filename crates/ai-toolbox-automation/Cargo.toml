[package]
name = "ai-toolbox-automation"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Headless automation contract and console foundation for AI Toolbox"
publish = false

[dependencies]
ai-toolbox-gateway-capabilities = { path = "../ai-toolbox-gateway-capabilities" }
ai-toolbox-paths = { path = "../ai-toolbox-paths" }
serde_json = "=1.0.149"

[lib]
name = "ai_toolbox_automation"

[[bin]]
name = "ai-toolbox-cli"
path = "src/main.rs"

# The client is Linux-only and independent of the desktop graph. Linking shared
# management/storage does not authorize database or owner initialization.
[target.'cfg(target_os = "linux")'.dependencies]
ai-toolbox-management = { path = "../ai-toolbox-management" }
tokio = { version = "=1.49.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "=1.0.149"

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "=0.2.180"

# Discovery must not initialize Tauri or any application state.
[workspace]
