[package]
name = "ai-toolbox-management"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Typed local management owner boundary for AI Toolbox"
publish = false

[dependencies]
ai-toolbox-codex-config = { path = "../ai-toolbox-codex-config" }
ai-toolbox-storage = { path = "../ai-toolbox-storage" }
rusqlite = { version = "=0.39.0", features = ["bundled", "backup", "hooks"] }
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.17"
tokio = { version = "=1.49.0", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
fs2 = "=0.4.3"
getrandom = "=0.3.4"
libc = "=0.2.180"

[dev-dependencies]
tempfile = "=3.24.0"
