# Preparation only. Do not dispatch until the shared Windows window is released.
# Requires the reviewed probe.py at scripts/probe-ssh433.py on the same branch.
name: SSH PowerShell 5.1 compatibility measurement
on:
  workflow_dispatch:
concurrency:
  group: ai-toolbox-ssh433-windows-measurement
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  measure:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ssh433-powershell51'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source commit
        shell: pwsh
        run: git rev-parse HEAD
      - name: Measure existing command templates in isolated temporary paths
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python scripts/probe-ssh433.py "$env:GITHUB_WORKSPACE"
      - name: Preserve raw output and explicit case verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified official v4
        with:
          name: ssh433-powershell51-measurements
          path: ${{ runner.temp }}/ai-ssh433-*/
          if-no-files-found: error
          retention-days: 7
