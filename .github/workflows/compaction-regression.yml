name: Compaction regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  websocket-regression:
    if: github.ref == 'refs/heads/maintenance/compaction-refusal-memory'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Record toolchain and disk
        run: |
          rustc --version
          cargo --version
          df -h
      - name: Verify all five regressions are selected
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tauri/Cargo.toml --lib websocket_compaction_refusal_memory -- --list > /tmp/compaction-tests.txt
          cat /tmp/compaction-tests.txt
          for name in ignores_failed_event ignores_incomplete_event ignores_failed_snapshot ignores_incomplete_snapshot keeps_ordinary_refusal; do
            grep -Fx "coding::proxy_gateway::runtime::websocket::tests::websocket_compaction_refusal_memory_${name}: test" /tmp/compaction-tests.txt
          done
          test "$(grep -c '^coding::proxy_gateway::runtime::websocket::tests::websocket_compaction_refusal_memory_.*: test$' /tmp/compaction-tests.txt)" -eq 5
      - name: Real WebSocket refusal-memory regression
        run: cargo test --locked --manifest-path tauri/Cargo.toml --lib websocket_compaction_refusal_memory -- --nocapture
