name: Native Linux empty-profile theme smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  native-smoke:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/native-theme-smoke'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Install and record official system prerequisites
        timeout-minutes: 7
        run: |
          set -euo pipefail
          mkdir -p /tmp/ai-native-evidence
          sudo apt-get update
          packages=(libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev xvfb dbus-x11 webkit2gtk-driver)
          pinned=()
          for package in "${packages[@]}"; do
            version=$(apt-cache policy "$package" | awk '/Candidate:/ {print $2}')
            test -n "$version" && test "$version" != '(none)'
            pinned+=("$package=$version")
          done
          printf '%s\n' "${pinned[@]}" | tee /tmp/ai-native-evidence/apt-versions.txt
          sudo apt-get install -y "${pinned[@]}"
          dpkg-query -W -f='${Package} ${Version}\n' webkit2gtk-driver | tee /tmp/ai-native-evidence/webkit-version.txt
          WebKitWebDriver --help | tee /tmp/ai-native-evidence/webkit-help.txt
          ldd "$(command -v WebKitWebDriver)" | tee /tmp/ai-native-evidence/webkit-libraries.txt
          # Fail before expensive compilation if Ubuntu's driver ABI is incompatible.
          dpkg-query -W -f='${Package} ${source:Version}\n' webkit2gtk-driver libwebkit2gtk-4.1-0 | tee /tmp/ai-native-evidence/webkit-package-sources.txt
          test "$(awk '{print $2}' /tmp/ai-native-evidence/webkit-package-sources.txt | sort -u | wc -l)" = 1
      - name: Install fixed Rust and official driver
        timeout-minutes: 7
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 install tauri-driver --version 2.1.0 --locked --root /tmp/ai-native-tools
          /tmp/ai-native-tools/bin/tauri-driver --help
      - name: Install frozen frontend and build real unbundled application
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee /tmp/ai-native-evidence/source-head.txt
          git ls-tree -r HEAD > /tmp/ai-native-evidence/source-tree.txt
          pnpm install --frozen-lockfile
          pnpm tauri build --help > /tmp/ai-native-evidence/build-help.txt
          grep -q -- '--debug' /tmp/ai-native-evidence/build-help.txt
          grep -q -- '--no-bundle' /tmp/ai-native-evidence/build-help.txt
          grep -q -- '--ci' /tmp/ai-native-evidence/build-help.txt
          grep -q -- 'ARGS' /tmp/ai-native-evidence/build-help.txt
          RUSTUP_TOOLCHAIN=1.99.1 pnpm tauri build --debug --no-bundle --ci -- --locked
          sha256sum tauri/target/debug/ai-toolbox | tee /tmp/ai-native-evidence/binary.sha256
          git diff --exit-code -- pnpm-lock.yaml tauri/Cargo.lock
      - name: Real native launch theme and restart smoke
        timeout-minutes: 8
        env:
          NATIVE_TOOLS: /tmp/ai-native-tools
          NATIVE_EVIDENCE: /tmp/ai-native-evidence
        run: |
          NATIVE_BINARY="$PWD/tauri/target/debug/ai-toolbox" python3 scripts/native-smoke/run_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-theme-smoke-evidence
          path: /tmp/ai-native-evidence
          retention-days: 7
