name: Deep-link handshake browser regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  browser-handshake:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/deeplink-handshake'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Record exact sources and browser
        run: |
          mkdir -p /tmp/deeplink-evidence
          git rev-parse HEAD | tee /tmp/deeplink-evidence/head.txt
          git ls-tree -r HEAD | grep -E 'useDeepLinkImport|deepLinkHandshake|DeepLinkHandshake|deepLink/fixtures/tauri|verify-deeplink|package.json|pnpm-lock|deepLink/AGENTS' | tee /tmp/deeplink-evidence/source-blobs.txt
          node --version
          pnpm --version
          google-chrome --version
      - name: Install existing locked dependencies
        timeout-minutes: 7
        run: pnpm install --frozen-lockfile
      - name: Browser RED on exact original hook
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          hook=web/features/shared/deepLink/useDeepLinkImport.ts
          cp "$hook" /tmp/deeplink-evidence/fixed-hook.ts
          trap 'cp /tmp/deeplink-evidence/fixed-hook.ts "$hook"' EXIT
          git show 4126f597159f6da917374c11fee85fdce0fcb2f0:"$hook" > "$hook"
          test "$(git hash-object "$hook")" = df3841510db55be9583b9330556b57103d4edc85
          set +e
          timeout 150s pnpm run test:deeplink-handshake > /tmp/deeplink-evidence/red.log 2>&1
          status=$?
          set -e
          cat /tmp/deeplink-evidence/red.log
          test "$status" = 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('/tmp/deeplink-evidence/red.log').read_text().splitlines() if line.startswith('{"passed":')]
          assert len(rows) == 1, 'Missing completed browser cases; infrastructure failure is not RED'
          result = rows[0]
          assert result['passed'] == 3 and result['failed'] == 3, result
          assert {failure['name'] for failure in result['failures']} == {'live wins over delayed cold', 'dismiss not reopened', 'latest live wins'}, result
          assert all('AssertionError' in failure['error'] for failure in result['failures']), result
          PY
      - name: Browser GREEN on candidate hook
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          hook=web/features/shared/deepLink/useDeepLinkImport.ts
          test "$(git hash-object "$hook")" = "$(git rev-parse HEAD:"$hook")"
          timeout 150s pnpm run test:deeplink-handshake | tee /tmp/deeplink-evidence/green.log
          grep -Fx 'Passed 6 browser checks.' /tmp/deeplink-evidence/green.log
      - name: Full TypeScript check
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit 2>&1 | tee /tmp/deeplink-evidence/tsc.log
          git diff --exit-code
      - name: Collect bounded browser diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          root = Path('/tmp/deeplink-evidence')
          root.mkdir(exist_ok=True)
          for folder in Path('/tmp').glob('deeplink-handshake-*'):
              for name in ['results.json', 'failure.html', 'failure.png']:
                  source = folder / name
                  if source.is_file(): shutil.copyfile(source, root / (folder.name + '-' + name))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deeplink-handshake-evidence
          path: /tmp/deeplink-evidence
          retention-days: 7
