name: AI Toolbox Next Windows Release

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: next-windows-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust tests
        run: cargo test --manifest-path tauri/Cargo.toml --jobs 2

      - name: Run frontend tests
        run: pnpm test

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Build Windows NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content 'tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = [string]$config.version
          $shortSha = '${{ github.sha }}'.Substring(0, 12)
          $tag = "v${version}-build.${shortSha}"
          $sourceExe = Get-ChildItem 'tauri/target/release/bundle/nsis' -Filter '*-setup.exe' -File | Select-Object -First 1
          if ($null -eq $sourceExe) {
            throw 'NSIS installer was not produced.'
          }

          $assetName = "AI-Toolbox-Next_${version}_build.${shortSha}_windows-x64-setup.exe"
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $assetName
          Copy-Item -LiteralPath $sourceExe.FullName -Destination $assetPath
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'SHA256SUMS') -Encoding utf8NoBOM

          @{
            version = $version
            source_commit = '${{ github.sha }}'
            installer = $assetName
            sha256 = $hash
            generated_at_utc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'build-provenance.json') -Encoding utf8NoBOM

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "asset_name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Toolbox-Next-windows-x64-${{ steps.assets.outputs.version }}
          path: |
            ${{ steps.assets.outputs.asset_name }}
            SHA256SUMS
            build-provenance.json
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: AI-Toolbox-Next ${{ steps.assets.outputs.version }} (${{ github.sha }})
          prerelease: true
          generate_release_notes: true
          body: |
            Independent AI-Toolbox-Next Windows x64 preview.

            Source commit: `${{ github.sha }}`
            Updates are manual downloads from this release. Verify `SHA256SUMS` before installing.
          files: |
            ${{ steps.assets.outputs.asset_name }}
            SHA256SUMS
            build-provenance.json
