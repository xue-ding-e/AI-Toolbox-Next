name: Isolated Responses reasoning item ID validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  reasoning-item-ids:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/reasoning-item-ids'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - name: Start bounded validation clock
        run: echo "VALIDATION_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 861aa4f05c83d0927128292276bd59bfeb54a2da
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'f41310dccb56f56bbea133d54f8bcba70cb4f1ba2695cbcb30069b0d55379d58  validation/candidate.diff' | sha256sum -c -
          echo 'd0af141498d4bb73846c3aacbac3439e6d07072ad6c9db6284e9cc533daf31ed  validation/manifest.json' | sha256sum -c -
          echo '4e8ce4a4750a3a4c3f940f3d7e2ff684edc2d08a2518d92a7e15caa67d926a3e  validation/validate.py' | sha256sum -c -
      - name: Real baseline RED, fixed GREEN and complete transformer inventory
        timeout-minutes: 33
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reasoning-item-ids-evidence
          path: |
            ${{ runner.temp }}/reasoning-item-ids-evidence/*.log
            ${{ runner.temp }}/reasoning-item-ids-evidence/*.json
            ${{ runner.temp }}/reasoning-item-ids-evidence/*.diff
          retention-days: 7
