name: Grok editor component validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/grok-editor-component-current-20261025' && github.sha == inputs.expected_sha
    # Direct GitHub-hosted VM, no container or fabricated runner flags.
    # Driver: effective cgroup capacity/headroom >=6/5GiB at admission,
    # sampled RSS <=4.5GiB; runtime effective headroom >=512MiB.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Start shared wall clock
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 1380 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: harness
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 059545a2d3e1145f7758e374e7d09e176f43caa3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Verify sealed product and harness inputs
        shell: bash
        run: |
          set -euo pipefail
          cd harness
          test "$(git rev-parse HEAD^)" = a1905cc34617dab44af81a115db262e90275cddf
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/grok-harness-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/grok-editor/audited-functions.json validation/grok-editor/memory_observation.py validation/grok-editor/source.json validation/grok-editor/test_contract.py validation/grok-editor/test_linear_seal.py validation/grok-editor/test_memory_guard.py validation/grok-editor/test_memory_observation.py validation/grok-editor/test_scanner.py validation/grok-editor/validate.py | sort | diff - "$RUNNER_TEMP/grok-harness-files"
          cd validation/grok-editor
          echo 'c3655eb2b4caa2b8896580c5da2cc0436ddb4b78888626398df6e7ace90284eb  audited-functions.json' | sha256sum -c -
          echo '2b8c55db52df60b8cae0ce717848f4248ff72e908d310630b21dd3ac8a376d98  memory_observation.py' | sha256sum -c -
          echo '587f212ff8638aa5a4b17e700cf67cea743ba4f2b9300b48416b913dbe2b9c60  source.json' | sha256sum -c -
          echo '6421789d111a3b13f2ab1050aaaaf36aab53d8a23b0c5fb9ab0aad1d0bb19b48  test_contract.py' | sha256sum -c -
          echo '9a0d181c6bce8e956d48bcfcbb217f0ffb5abb194c9231cb844d6ab1e261669e  test_linear_seal.py' | sha256sum -c -
          echo '967a4d4b2fc2e5b5f1163ebd4d18e8d0e8f8a2756a07c162ea0f9f898d7b4db8  test_memory_guard.py' | sha256sum -c -
          echo '897a4a067ffdf442ed498f9e32ea880080574d78987d3e67f1c6908197d8aacd  test_memory_observation.py' | sha256sum -c -
          echo 'e1ef818863f237bfa6945a5840006efc4227e9cbd1e663b4f48e5ad314dc50dc  test_scanner.py' | sha256sum -c -
          echo '79e73207a6286709e69f13a3ff3cf861d921bf4c52ae5a7395a42be1afc262c7  validate.py' | sha256sum -c -
          python3 -B -m unittest test_memory_observation test_memory_guard test_scanner test_linear_seal test_contract
          test -x /usr/bin/google-chrome
      - name: One supervised six-editor plus four-catalog attempt
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 120
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 harness/validation/grok-editor/validate.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-editor-catalog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
