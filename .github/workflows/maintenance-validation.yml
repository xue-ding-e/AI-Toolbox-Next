# Prepared only: parent must review these four fixed harness files before any dispatch.
# The one shared 8-minute clock starts before Node setup; no Rust/APT/package install. Command
# ceilings never reset it. The 15-minute job reserves checkout/upload/cleanup.
name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation commit SHA (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  typed-context-admission-stage2:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/typed-context-admission-stage2' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify sealed four-file harness before any setup
        timeout-minutes: 2
        run: python3 scripts/typed-context-admission-stage2-validation/validate.py --phase preflight
      - uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '22'
      - name: Diagnose only short-browser scope without dependencies, build or suite
        timeout-minutes: 8
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/typed-context-admission-stage2-evidence"
          seconds=$(python3 - "$evidence/preflight-budget.json" <<'PY_CLOCK'
          import json,sys,time
          remaining=int(json.load(open(sys.argv[1]))['deadline_monotonic']-time.monotonic())
          # TERM at least 15 seconds before the original deadline; KILL grace
          # is ten seconds, leaving five seconds before that same deadline.
          if remaining <= 15: raise SystemExit('original shared deadline exhausted; validation not started')
          print(remaining-15)
          PY_CLOCK
          ) || exit $?
          wrapper_status=null
          write_validation_summary() {
            python3 - "$evidence" "$wrapper_status" "$seconds" <<'PY_WRAPPER'
          import json,pathlib,sys,time
          root=pathlib.Path(sys.argv[1])
          deadline=json.loads((root/"preflight-budget.json").read_text())["deadline_monotonic"]
          code=None if sys.argv[2]=="null" else int(sys.argv[2])
          result={"wrapper_exit":code,"term_after_seconds":int(sys.argv[3]),
                  "kill_grace_seconds":10,"original_deadline_monotonic":deadline,
                  "finished_monotonic":time.monotonic(),"shared_budget_was_not_reset":True,
                  "completed_within_deadline":code==0 and time.monotonic()<=deadline,
                  "timeout_or_unknown_is_incomplete_not_product_red":code!=0,
                  "forced_kill_cleanup_guarantee":"Unconfirmed descendants/fixtures retained; runner job is outer containment"}
          (root/"validation-wrapper.json").write_text(json.dumps(result,indent=2)+"\n")
          PY_WRAPPER
          }
          trap write_validation_summary EXIT
          if timeout --signal=TERM --kill-after=10s "${seconds}s" python3 scripts/typed-context-admission-stage2-validation/validate.py --phase validation --diagnostic-only; then
            wrapper_status=0
          else
            wrapper_status=$?
          fi
          exit "$wrapper_status"
      - name: Upload bounded evidence and whitelisted synthetic failure HTML/PNG, never profiles or caches
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: typed-context-admission-stage2-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/preflight-*.json
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/preflight-*.log
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/validation-*.json
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/validation-*.log
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/validation-*.patch
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/validation-frontend-failure-*.html
            ${{ runner.temp }}/typed-context-admission-stage2-evidence/validation-frontend-failure-*.png
          if-no-files-found: error
          retention-days: 7
