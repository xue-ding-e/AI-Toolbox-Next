name: Grok editor component validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/grok-editor-component-current-20261025' && github.sha == inputs.expected_sha
    # Direct GitHub-hosted VM, no container or fabricated runner flags.
    # Driver: effective cgroup capacity/headroom >=6/5GiB at admission,
    # sampled RSS <=4.5GiB; runtime effective headroom >=512MiB.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Start shared wall clock
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 1380 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: harness
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: 904082cdfe6dbc0279e89731c7cddbf9f87807e3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Verify sealed product and harness inputs
        shell: bash
        run: |
          set -euo pipefail
          cd harness
          test "$(git rev-parse HEAD^)" = 6ad31646f799cfa5aa77a7b344db7deedcccd114
          test "$(git rev-parse HEAD^^)" = d5f1604eae7af9f622c742c5b653e4b916d3b37a
          test "$(git rev-parse HEAD^^^)" = 67da2c651a01abc47f782d3f38e64917cdb9a45b
          test "$(git rev-parse HEAD^^^^)" = b4d661ff01147bd6060df92be763171d1f95ed18
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test -z "$(git status --porcelain)"
          git diff --name-only HEAD^^^^ HEAD | sort > "$RUNNER_TEMP/grok-harness-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/grok-editor/audited-baseline-f617d51.py.txt validation/grok-editor/audited-functions.json validation/grok-editor/batch_lifecycle.py validation/grok-editor/memory_observation.py validation/grok-editor/source.json validation/grok-editor/test_batch_lifecycle.py validation/grok-editor/test_contract.py validation/grok-editor/test_linear_seal.py validation/grok-editor/test_memory_guard.py validation/grok-editor/test_memory_observation.py validation/grok-editor/test_scanner.py validation/grok-editor/validate.py | sort | diff - "$RUNNER_TEMP/grok-harness-files"
          cd validation/grok-editor
          echo 'c4230e5646ccc6678a706e60e0f689dab663f7683c31e1eb176702f71f0994e8  audited-baseline-f617d51.py.txt' | sha256sum -c -
          echo '1c36e391471f1f9c14f8d33a8905121258a42eae51f10a98f25064479ce827ef  audited-functions.json' | sha256sum -c -
          echo '2b8c55db52df60b8cae0ce717848f4248ff72e908d310630b21dd3ac8a376d98  memory_observation.py' | sha256sum -c -
          echo 'ac80679315e595aeec29119e6c527ae5295607b663b14fabbbf8af817b5a655d  source.json' | sha256sum -c -
          echo '8c2dc37f442a2af2bbc625b00d75a5e270eb46fa19b9f90cc09a8edf22d2947c  test_contract.py' | sha256sum -c -
          echo 'c92d5c68733ab0c6181b090f41d471621a5745de426393f4b2dced0c7531665e  batch_lifecycle.py' | sha256sum -c -
          echo 'e3e25203921852944c9f5177cc2ca8b7c9684938b898e1bb1bbba57149883c26  test_batch_lifecycle.py' | sha256sum -c -
          python3 --version
          echo '9a0d181c6bce8e956d48bcfcbb217f0ffb5abb194c9231cb844d6ab1e261669e  test_linear_seal.py' | sha256sum -c -
          echo '967a4d4b2fc2e5b5f1163ebd4d18e8d0e8f8a2756a07c162ea0f9f898d7b4db8  test_memory_guard.py' | sha256sum -c -
          echo '897a4a067ffdf442ed498f9e32ea880080574d78987d3e67f1c6908197d8aacd  test_memory_observation.py' | sha256sum -c -
          echo 'e1ef818863f237bfa6945a5840006efc4227e9cbd1e663b4f48e5ad314dc50dc  test_scanner.py' | sha256sum -c -
          echo 'dbe8b023d974ae24a99820641680cdbccc218831cddcbc500fd102b1d033ba6c  validate.py' | sha256sum -c -
          python3 -B -m unittest test_memory_observation test_memory_guard test_scanner test_linear_seal test_contract test_batch_lifecycle
          node --test "$GITHUB_WORKSPACE/source/scripts/lib/grok-batch-lifecycle.test.mjs" "$GITHUB_WORKSPACE/source/web/test/features/coding/grok/editorReadback/fixtureBoundaries.test.ts"
          test -x /usr/bin/google-chrome
      - name: One supervised six-editor plus four-catalog attempt
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 120
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 harness/validation/grok-editor/validate.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-editor-catalog-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
