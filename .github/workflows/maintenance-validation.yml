name: SSH connection result browser regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  browser:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ssh-request-race'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 7450fc2d19fcd1c50832f2674dc0841b5bc2c43b
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Record official installed tools
        run: |
          node --version
          pnpm --version
          google-chrome --version
      - name: Exact-source RED GREEN and full TypeScript
        timeout-minutes: 21
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-request-race-evidence
          path: |
            ${{ runner.temp }}/ssh-race-evidence/*.log
            ${{ runner.temp }}/ssh-race-evidence/*.json
            ${{ runner.temp }}/ssh-race-evidence/*.diff
            ${{ runner.temp }}/ssh-race-evidence/*/ssh-request-race-*/ssh-request-cases.json
            ${{ runner.temp }}/ssh-race-evidence/*/ssh-request-race-*/results.json
            ${{ runner.temp }}/ssh-race-evidence/*/ssh-request-race-*/failure.html
            ${{ runner.temp }}/ssh-race-evidence/*/ssh-request-race-*/failure.png
          retention-days: 7
