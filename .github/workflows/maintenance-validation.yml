name: Isolated automation qualification
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'owner-core first; bundle rechecks owner-core before building'
        required: true
        type: choice
        options: [owner-core, fixture, bundle]
      expected_source_sha:
        description: 'Must equal the reviewed source pinned in this control'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
  queue: max
env:
  SOURCE_SHA: e91fdebf245a17192b9d1c8b173a279313148581
  SOURCE_TREE: 372ec70d1ddffa34c7c4c0398132dd548e97e4d1
jobs:
  owner-core:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.repository_id == '1422130502' && github.ref == 'refs/heads/validation/automation-fixture-budget-control-20261031'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Refuse unreviewed stage or source before checkout
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_sha }}
          REQUESTED_STAGE: ${{ inputs.stage }}
        run: |
          if ($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_SOURCE -cne $env:SOURCE_SHA) { throw 'This control only accepts its reviewed source SHA' }
          if ($env:REQUESTED_STAGE -cnotin @('owner-core','fixture','bundle')) { throw 'Unknown qualification stage' }
      - uses: actions/checkout@v4
        with:
          ref: e91fdebf245a17192b9d1c8b173a279313148581
          persist-credentials: false
          fetch-depth: 0
      - name: Verify pinned product tree and exact changed-path allowlist
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or (git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE) { throw 'Pinned product identity mismatch' }
          if ((git rev-list --count --merges HEAD).Trim() -ne '0') { throw 'Product history is not linear' }
          $allowed = @('AGENTS.md', '.github/validation/windows-package/automation-profile.mjs', '.github/validation/windows-package/automation-profile.test.mjs', '.github/validation/windows-package/windows-shell-fixture.ps1', '.github/validation/windows-package/automation-fixture-qualify.mjs', '.github/validation/windows-package/automation-install.mjs', '.github/validation/windows-package/automation-smoke.mjs', '.github/validation/windows-package/automation-smoke.test.mjs', '.github/validation/windows-package/package.mjs', '.github/validation/windows-package/publish.mjs', '.github/validation/windows-package/publish.test.mjs', '.github/validation/windows-package/windows-owned-process.ps1', '.github/validation/windows-package/windows-owned-process.test.ps1', '.github/workflows/windows-manual-build.yml', 'README.md', 'README.zh-CN.md', 'tauri/tauri.automation.conf.json')
          $changed = @(git diff-tree --no-commit-id --name-only -r c95f9ec1bc54904ea850a2e2f5b7166db681d6dd HEAD)
          if (@(Compare-Object ($allowed | Sort-Object) ($changed | Sort-Object)).Count -ne 0) { throw 'Reviewed changed-path allowlist mismatch' }
          if ((Get-FileHash .github/validation/windows-package/windows-owned-process.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9460335fec78be0453ce8ec294a21fa78a3b4105e45913b398951cfd19965c6f') { throw 'Reviewed owner helper changed' }
          if ((Get-FileHash .github/validation/windows-package/windows-owned-process.test.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() -cne '04fca7c2cd008f07d52ce0d604278b2c219e6a89c81932af19d3eb203a419fe5') { throw 'Reviewed owner tests changed' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Lightweight packaging controls
        run: |
          node --test .github/validation/windows-package/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Lightweight controls failed' }
      - name: Native owner qualification with bounded outer Job
        run: |
          . .github/validation/windows-package/windows-owned-process.ps1
          $result = Invoke-NextOwnedProcess -FilePath (Get-Process -Id $PID).Path -Arguments @('-NoProfile','-NonInteractive','-File','.github/validation/windows-package/windows-owned-process.test.ps1') -WorkingDirectory $PWD.Path -TimeoutSeconds 180 -EvidencePrefix "$env:RUNNER_TEMP/automation-owner-controls"
          if (-not $result.naturalQuiescence -or -not $result.quiescenceConfirmed -or $null -ne $result.toolCleanup) { throw 'Owner qualification process tree did not finish naturally' }
          @{ source_commit=$env:SOURCE_SHA; source_tree=$env:SOURCE_TREE; control_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID; workflow_attempt=$env:GITHUB_RUN_ATTEMPT; helper_sha256='9460335fec78be0453ce8ec294a21fa78a3b4105e45913b398951cfd19965c6f'; owner_tests_sha256='04fca7c2cd008f07d52ce0d604278b2c219e6a89c81932af19d3eb203a419fe5' } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/owner-source.json" -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-owner-core-e91fdebf245a17192b9d1c8b173a279313148581-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/automation-owner-controls.*
            ${{ runner.temp }}/next-process-controls-*/**
            ${{ runner.temp }}/owner-source.json
          if-no-files-found: error
          retention-days: 14
  fixture:
    needs: owner-core
    if: inputs.stage != 'owner-core'
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e91fdebf245a17192b9d1c8b173a279313148581
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fetch the exact public GUI-only fixture baseline
        timeout-minutes: 3
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'gui-only-0b8e83aa2606-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/xue-ding-e/AI-Toolbox-Next/releases/download/v1.2.1-next.1-build.0b8e83aa2606/AI-Toolbox-Next_1.2.1-next.1_0b8e83aa2606_windows-x64-setup.exe' -OutFile $previous -TimeoutSec 120
          if ((Get-Item $previous).Length -ne 15501542 -or (Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -cne '1451c7cf8eec647edaaf284d6ab451a65b2433d2867cb201d4554310f590a658') { throw 'GUI-only fixture baseline mismatch' }
      - name: Qualify only the synthetic shell fixture in an owned Job
        timeout-minutes: 5
        run: |
          if ((git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or (git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE) { throw 'Fixture source mismatch' }
          . .github/validation/windows-package/windows-owned-process.ps1
          $arguments = @('.github/validation/windows-package/automation-fixture-qualify.mjs', "$env:RUNNER_TEMP/gui-only-0b8e83aa2606-setup.exe", "$env:RUNNER_TEMP/automation-fixture.json")
          $result = Invoke-NextOwnedProcess -FilePath (Get-Command node.exe).Source -Arguments $arguments -WorkingDirectory $PWD.Path -TimeoutSeconds 240 -EvidencePrefix "$env:RUNNER_TEMP/automation-fixture-owner"
          if (-not $result.naturalQuiescence -or -not $result.quiescenceConfirmed -or $null -ne $result.toolCleanup) { throw 'Fixture tree did not become naturally empty' }
          $receiptPath = "$env:RUNNER_TEMP/automation-fixture-owner.result.json"
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          $binding = @{source_commit=$env:SOURCE_SHA; source_tree=$env:SOURCE_TREE; control_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID; workflow_attempt=$env:GITHUB_RUN_ATTEMPT; fixture_only=$true; bundled_cli_mcp_qualified=$false}
          foreach ($entry in @(@{key='helper_sha256';path='.github/validation/windows-package/windows-owned-process.ps1'}, @{key='initializer_sha256';path='.github/validation/windows-package/windows-shell-fixture.ps1'}, @{key='profile_sha256';path='.github/validation/windows-package/automation-profile.mjs'}, @{key='root_script_sha256';path='.github/validation/windows-package/automation-fixture-qualify.mjs'}, @{key='fixture_evidence_sha256';path="$env:RUNNER_TEMP/automation-fixture.json"})) { $binding[$entry.key] = (Get-FileHash -LiteralPath $entry.path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $receipt | Add-Member -NotePropertyName binding -NotePropertyValue $binding
          $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $receiptPath -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-only-evidence-e91fdebf245a17192b9d1c8b173a279313148581-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/automation-fixture.json
            ${{ runner.temp }}/automation-fixture-owner.*
          if-no-files-found: error
          retention-days: 14
  bundle:
    needs: [owner-core, fixture]
    if: inputs.stage == 'bundle' && github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.repository_id == '1422130502' && github.ref == 'refs/heads/validation/automation-fixture-budget-control-20261031'
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_BUILD_SHA: e91fdebf245a17192b9d1c8b173a279313148581
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e91fdebf245a17192b9d1c8b173a279313148581
          persist-credentials: false
      - name: Isolate synthetic application data
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'synthetic-build-data'
          "AI_TOOLBOX_DATA_DIR=$data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked frontend dependencies
        timeout-minutes: 10
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
      - name: Source and packaging controls
        timeout-minutes: 5
        run: |
          node --test .github/validation/windows-package/*.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaging controls failed' }
          node .github/validation/windows-package/package.mjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Source identity check failed' }
      - name: Frontend type check
        timeout-minutes: 10
        run: |
          pnpm exec tsc --noEmit
          if ($LASTEXITCODE -ne 0) { throw 'Frontend type check failed' }
      - name: Real-route synthetic auth export browser regression
        timeout-minutes: 15
        run: |
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          if ($ram -lt 6GB) { throw 'Browser build requires at least 6 GiB host memory' }
          node scripts/verify-codex-auth-entry.mjs --output "$env:RUNNER_TEMP/auth-browser-evidence"
          if ($LASTEXITCODE -ne 0) { throw 'Auth export browser regression failed' }
      # pnpm test includes serial browser builds; 15 minutes truncated passing suites.
      - name: Frontend full regression suite (unit and browser)
        timeout-minutes: 35
        run: |
          pnpm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend regression gate failed' }
      - name: Native account export and OAuth regression gates
        timeout-minutes: 45
        run: '& .github/validation/windows-package/test-native.ps1'
      # Artifact-only: no signing secret, Release/tag, updater channel or Rust cache.
      # The later synthetic installation gate does not establish interactive GUI or real-account OAuth.
      - name: Build the shared CLI and stdio MCP executable
        timeout-minutes: 10
        run: |
          cargo build --locked --release --manifest-path crates/ai-toolbox-automation/Cargo.toml --target x86_64-pc-windows-msvc --target-dir tauri/target/automation-build --bin ai-toolbox-cli
          if ($LASTEXITCODE -ne 0) { throw 'Automation console build failed' }
          New-Item -ItemType Directory -Force tauri/target/automation-sidecars | Out-Null
          Copy-Item tauri/target/automation-build/x86_64-pc-windows-msvc/release/ai-toolbox-cli.exe tauri/target/automation-sidecars/ai-toolbox-cli-x86_64-pc-windows-msvc.exe
      - name: Build unsigned Next NSIS installer
        timeout-minutes: 60
        run: |
          pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis --config tauri/tauri.automation.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Native installer build failed' }
      - name: Preserve explicitly unqualified build diagnostics
        timeout-minutes: 3
        run: |
          $installers = @(Get-ChildItem tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one diagnostic installer' }
          $directory = Join-Path $env:RUNNER_TEMP 'automation-unqualified'
          New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          $inputs = @(@{kind='installer'; path=$installers[0].FullName}, @{kind='console'; path=(Resolve-Path 'tauri/target/automation-sidecars/ai-toolbox-cli-x86_64-pc-windows-msvc.exe').Path})
          $files = @()
          foreach ($inputFile in $inputs) {
            $name = if ($inputFile.kind -eq 'installer') { 'unqualified-setup.exe' } else { 'ai-toolbox-cli.exe' }
            $destination = Join-Path $directory $name
            Copy-Item -LiteralPath $inputFile.path -Destination $destination -ErrorAction Stop
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -cne (Get-FileHash -LiteralPath $inputFile.path -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Diagnostic copy mismatch' }
            $files += @{kind=$inputFile.kind; name=$name; bytes=(Get-Item -LiteralPath $destination).Length; sha256=$hash}
          }
          @{qualified=$false; purpose='diagnostic-only-not-release'; source_commit=(git rev-parse HEAD).Trim(); source_tree=(git rev-parse 'HEAD^{tree}').Trim(); control_commit=$env:GITHUB_SHA; workflow_run=$env:GITHUB_RUN_ID; workflow_attempt=$env:GITHUB_RUN_ATTEMPT; files=$files} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $directory 'unqualified-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: unqualified-windows-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automation-unqualified/*
          if-no-files-found: error
          retention-days: 3
      - name: Native Job Object negative controls
        timeout-minutes: 5
        run: |
          . .github/validation/windows-package/windows-owned-process.ps1
          $controlResult = Invoke-NextOwnedProcess -FilePath (Get-Process -Id $PID).Path -Arguments @('-NoProfile', '-NonInteractive', '-File', '.github/validation/windows-package/windows-owned-process.test.ps1') -WorkingDirectory $PWD.Path -TimeoutSeconds 180 -EvidencePrefix "$env:RUNNER_TEMP/automation-owner-controls"
          if (-not $controlResult.naturalQuiescence -or -not $controlResult.quiescenceConfirmed -or $null -ne $controlResult.toolCleanup) { throw 'Native owner controls did not finish with a naturally empty process tree' }
      - name: Fetch the pinned public GUI-only transition baseline
        timeout-minutes: 5
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'gui-only-0b8e83aa2606-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/xue-ding-e/AI-Toolbox-Next/releases/download/v1.2.1-next.1-build.0b8e83aa2606/AI-Toolbox-Next_1.2.1-next.1_0b8e83aa2606_windows-x64-setup.exe' -OutFile $previous -TimeoutSec 120
          if ((Get-Item $previous).Length -ne 15501542) { throw 'GUI-only baseline size mismatch' }
          if ((Get-FileHash $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1451c7cf8eec647edaaf284d6ab451a65b2433d2867cb201d4554310f590a658') { throw 'GUI-only baseline digest mismatch' }
      - name: Install, exercise CLI and MCP, reinstall and uninstall in a synthetic profile
        timeout-minutes: 10
        run: |
          $installers = @(Get-ChildItem tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          . .github/validation/windows-package/windows-owned-process.ps1
          $env:AUTOMATION_INVOCATION_ID = [Guid]::NewGuid().ToString('N')
          $arguments = @('.github/validation/windows-package/automation-install.mjs', $installers[0].FullName, 'tauri/target/automation-sidecars/ai-toolbox-cli-x86_64-pc-windows-msvc.exe', "$env:RUNNER_TEMP/automation-install.json", "$env:RUNNER_TEMP/gui-only-0b8e83aa2606-setup.exe", '1451c7cf8eec647edaaf284d6ab451a65b2433d2867cb201d4554310f590a658')
          # Every installer, console and MCP descendant remains in this exact Job.
          # Never enable the DSH compiler-specific VerifiedTool exception here.
          $result = Invoke-NextOwnedProcess -FilePath (Get-Command node.exe).Source -Arguments $arguments -WorkingDirectory $PWD.Path -TimeoutSeconds 480 -EvidencePrefix "$env:RUNNER_TEMP/automation-lifecycle"
          if (-not $result.naturalQuiescence -or -not $result.quiescenceConfirmed -or $null -ne $result.toolCleanup) { throw 'Installed automation process ownership incomplete' }
          $receiptPath = "$env:RUNNER_TEMP/automation-lifecycle.result.json"
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          $binding = @{
            source_commit = $env:SOURCE_SHA; control_commit = $env:GITHUB_SHA; workflow_run = $env:GITHUB_RUN_ID; workflow_attempt = $env:GITHUB_RUN_ATTEMPT
            invocation_id = $env:AUTOMATION_INVOCATION_ID
            installer_sha256 = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            helper_sha256 = (Get-FileHash .github/validation/windows-package/windows-owned-process.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
            root_script_sha256 = (Get-FileHash .github/validation/windows-package/automation-install.mjs -Algorithm SHA256).Hash.ToLowerInvariant()
            lifecycle_sha256 = (Get-FileHash "$env:RUNNER_TEMP/automation-install.json" -Algorithm SHA256).Hash.ToLowerInvariant()
            root_script = '.github/validation/windows-package/automation-install.mjs'; compiler_exception_enabled = $false
          }
          $receipt | Add-Member -NotePropertyName binding -NotePropertyValue $binding
          $receipt | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $receiptPath -Encoding utf8
      - name: Seal exact-source installer and checksums
        timeout-minutes: 5
        run: |
          node .github/validation/windows-package/package.mjs seal
          if ($LASTEXITCODE -ne 0) { throw 'Artifact provenance gate failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-windows-x64-e91fdebf245a17192b9d1c8b173a279313148581-${{ github.run_attempt }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualified-windows-evidence-e91fdebf245a17192b9d1c8b173a279313148581-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auth-browser-evidence/**/results.json
            ${{ runner.temp }}/native-tests-*.log
            ${{ runner.temp }}/automation-install.json
            ${{ runner.temp }}/automation-lifecycle.*
            ${{ runner.temp }}/automation-owner-controls.*
            ${{ runner.temp }}/next-process-controls-*/**
            tauri/target/x86_64-pc-windows-msvc/release/nsis/x64/installer.nsi
          if-no-files-found: warn
          retention-days: 14
