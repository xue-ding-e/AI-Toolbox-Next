name: Pricing page-size frontend validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  frontend:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/gateway-pricing-441-frontend-20261026' && github.sha == inputs.expected_sha
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Start shared 23-minute wall clock
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 1380 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: driver
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: 8269bc61aa3f5932504613e172ed57382e27db02
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify exact reviewed driver, product and lightweight contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 9.15.0
          cd driver
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD^)" = 6133359de4cfaf346ff9a01903f5ce13ddd2c6e6
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$GITHUB_WORKSPACE/contract-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/contract-tmp"
          git diff --name-only HEAD^ HEAD | sort > "$TMPDIR/driver-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/pricing-441/driver.py validation/pricing-441/reviewed-92198-full.py.txt validation/pricing-441/source.json validation/pricing-441/test-codex-usage-440-driver.py validation/pricing-441/test_driver.py validation/pricing-441/verify-codex-usage-440.py | sort | diff - "$TMPDIR/driver-files"
          echo 'f59989edfb0cc7daff69db9b545a8a311853b36b02a1c3fc71e8563b190e3682  validation/pricing-441/driver.py' | sha256sum -c -
          echo 'f4668f021f9ea7354d1845c89a0f51b6b43b8b8d208abb68f69e510bf031f017  validation/pricing-441/reviewed-92198-full.py.txt' | sha256sum -c -
          echo '90c7dc82cb8a62fb0f236416d752e749d08c584bb51273fa8756a011f9142d17  validation/pricing-441/source.json' | sha256sum -c -
          echo '4475ca97db59ca4b778e32200704b565e4238c9d8861a65e602e395a825c0226  validation/pricing-441/test-codex-usage-440-driver.py' | sha256sum -c -
          echo '16ed33cbe44507ac9f20e319b2651d37da07fb1fb247b08677a74b8980c710b3  validation/pricing-441/test_driver.py' | sha256sum -c -
          echo '9cf38152e91ba9b7b4aec21c87db758c886d3acb877c3017ecf7629115c94993  validation/pricing-441/verify-codex-usage-440.py' | sha256sum -c -
          cd validation/pricing-441
          python3 -B test-codex-usage-440-driver.py
          python3 -B test_driver.py
          python3 -B -c 'import os; from pathlib import Path; import driver; driver.verify_source(Path(os.environ["GITHUB_WORKSPACE"]) / "product")'
      - name: Four sealed frontend stages, no browser or Rust
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 5
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 -B driver/validation/pricing-441/driver.py product evidence "${{ inputs.expected_sha }}" 2>&1 | tee evidence/driver.log
      - name: Preserve exact stage, source, dist and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-441-frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
