name: Maintenance validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false

jobs:
  codex-credits-rust-comparison:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/codex-credits-rust-comparison'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23b35d815cc5899d0d4f70d872a403ca5fe68f57
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f9c67622f59a53707ef1cd463771485b3f13bd79
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Record both exact trees and shared environment
        run: |
          git -C baseline rev-parse HEAD 'HEAD^{tree}'
          git -C candidate rev-parse HEAD 'HEAD^{tree}'
          rustc --version
          cargo --version
          date --iso-8601=seconds
          date +'%Z %z'
          free -m
          df -h
      - name: Compare Qoder fixtures then collect all candidate Rust targets
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/credits-rust-comparison-target"
          failed=0
          run_check() {
            label="$1"
            directory="$2"
            shift 2
            echo "::group::$label"
            date --iso-8601=seconds
            if (cd "$directory" && "$@"); then
              echo "RESULT $label: PASS"
            else
              code=$?
              echo "RESULT $label: FAIL (exit $code)"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          }
          verify_qoder_selection() {
            output="$RUNNER_TEMP/qoder-$1-tests"
            cargo test --locked --manifest-path tauri/Cargo.toml --lib coding::proxy_gateway::session_import::tests::qoder_ -- --list > "$output" || return
            cat "$output"
            grep -Fx '9 tests, 0 benchmarks' "$output" || return
            for name in cli_keeps_zero_token_calls_and_reads_the_working_directory cli_reads_the_nested_cache_creation_pair_and_the_config_model cn_transcripts_stay_separate_from_the_international_cli ide_subtracts_the_cached_prompt_and_files_each_edition_apart ide_sums_the_rows_of_one_request_instead_of_overwriting_them ide_falls_back_to_the_integer_rowid_when_message_id_is_absent ide_without_the_chat_message_table_is_a_no_op tool_keys_serialize_exactly_as_their_app_type credits_are_stored_beside_zero_tokens; do
              grep -Fx "coding::proxy_gateway::session_import::tests::qoder_${name}: test" "$output" || return
            done
          }
          run_check baseline-selection baseline verify_qoder_selection baseline
          run_check baseline-qoder baseline cargo test --locked --manifest-path tauri/Cargo.toml --lib coding::proxy_gateway::session_import::tests::qoder_ -- --test-threads=1 --nocapture
          run_check candidate-selection candidate verify_qoder_selection candidate
          run_check candidate-qoder candidate cargo test --locked --manifest-path tauri/Cargo.toml --lib coding::proxy_gateway::session_import::tests::qoder_ -- --test-threads=1 --nocapture
          # Continue to integration and doctests even if the library target fails;
          # cargo still returns failure, and the combined gate stays failed.
          run_check candidate-all-targets candidate cargo test --locked --manifest-path tauri/Cargo.toml --no-fail-fast
          test "$failed" -eq 0
