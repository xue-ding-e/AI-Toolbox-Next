name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  owner-primitives:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/owner-primitives' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.99.1
      - name: Validate fixed source and pure Linux owner primitives
        timeout-minutes: 10
        run: python3 scripts/owner-validation/validate.py
      - name: Upload only bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: owner-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/owner-evidence/validation-*.json
            ${{ runner.temp }}/owner-evidence/validation-*.log
          if-no-files-found: error
          retention-days: 7
