        cargo --version | tee -a "$RUNNER_TEMP/native-evidence/toolchain.txt"
        df -h | tee "$RUNNER_TEMP/native-evidence/disk.txt"
        free -m | tee "$RUNNER_TEMP/native-evidence/memory.txt"
        echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-target" >> "$GITHUB_ENV"
        for name in HOME USERPROFILE; do echo "$name=$RUNNER_TEMP/native-home" >> "$GITHUB_ENV"; done
        for name in APPDATA XDG_CONFIG_HOME; do echo "$name=$RUNNER_TEMP/native-config" >> "$GITHUB_ENV"; done
        for name in LOCALAPPDATA AI_TOOLBOX_DATA_DIR AI_TOOLBOX_CACHE_DIR XDG_DATA_HOME XDG_CACHE_HOME CODEX_HOME; do echo "$name=$RUNNER_TEMP/native-local/$name" >> "$GITHUB_ENV"; done
        sha256sum crates/ai-toolbox-gateway-capabilities/Cargo.lock crates/ai-toolbox-automation/Cargo.lock tauri/Cargo.lock > "$RUNNER_TEMP/native-evidence/locks.sha256"
    - name: Verify final formatting and locked headless crates
      timeout-minutes: 15
      run: |
        set -euo pipefail
        rustfmt --version | tee -a "$RUNNER_TEMP/native-evidence/toolchain.txt"
        cargo fmt --manifest-path crates/ai-toolbox-gateway-capabilities/Cargo.toml -- --check
        cargo fmt --manifest-path crates/ai-toolbox-automation/Cargo.toml -- --check
        rustfmt --check --edition 2021 --config skip_children=true crates/ai-toolbox-gateway-capabilities/src/lib.rs crates/ai-toolbox-automation/src/cli.rs crates/ai-toolbox-automation/src/lib.rs crates/ai-toolbox-automation/src/mcp.rs crates/ai-toolbox-automation/tests/console.rs crates/ai-toolbox-automation/tests/path_protocol.rs tauri/src/coding/proxy_gateway/types.rs tauri/src/coding/proxy_gateway/commands.rs tauri/src/coding/proxy_gateway/cli_proxy/mod.rs
        for crate in ai-toolbox-gateway-capabilities ai-toolbox-automation; do
          cargo test --locked --manifest-path "crates/$crate/Cargo.toml" --jobs 1 -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-evidence/$crate-tests.log"
        done
        node - "$RUNNER_TEMP/native-evidence" <<'NODE'
        const fs=require('node:fs'), assert=require('node:assert/strict');
        for(const [crate,expected] of [['ai-toolbox-gateway-capabilities',[2]],['ai-toolbox-automation',[9,8,17,6]]]) {
         const text=fs.readFileSync(`${process.argv[2]}/${crate}-tests.log`,'utf8');
         const results=[...text.matchAll(/test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;/g)];
         assert(results.length); for(const m of results) { assert.equal(Number(m[2]),0); assert.equal(Number(m[3]),0); }
         assert.deepEqual(results.map(m=>Number(m[1])).filter(n=>n>0),expected);
        }
        console.log('Final Linux shared 2 and automation 40 tests verified.');
        NODE
