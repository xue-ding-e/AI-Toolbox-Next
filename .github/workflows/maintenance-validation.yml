name: Maintenance validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false

jobs:
  codex-credits-rust-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/codex-extra-credits-rust'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Record exact revision and resources
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
          free -m
          df -h
      - name: Verify new credits tests are selected
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path tauri/Cargo.toml --lib coding::codex::official_accounts::tests::codex_credits -- --list > /tmp/codex-credits-tests
          cat /tmp/codex-credits-tests
          for name in parse_strings_numbers_and_preserve_subscription_windows preserve_zero_negative_and_conflicting_availability malformed_fields_do_not_fail_or_invent_a_balance round_trip_refresh_clear_and_failure_are_account_scoped old_records_and_virtual_logins_have_no_invented_balance preparation_failure_clears_persisted_balance oauth_refresh_does_not_restore_an_older_usage_snapshot; do
            grep -Fx "coding::codex::official_accounts::tests::codex_credits_${name}: test" /tmp/codex-credits-tests
          done
      - name: Credits regressions
        run: cargo test --locked --manifest-path tauri/Cargo.toml --lib coding::codex::official_accounts::tests::codex_credits
      - name: Full upstream Rust suite
        run: cargo test --locked --manifest-path tauri/Cargo.toml
