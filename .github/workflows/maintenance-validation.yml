name: SSH drained-close deadline coverage validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  ssh-lib:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ssh-drained-close-20261026' && github.sha == inputs.expected_sha
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Start one shared 35-minute wall clock including setup
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 2100 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          path: driver
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          path: product
          ref: a18b38030c8f811481ed63d050d4c601fc29e044
          persist-credentials: false
      - name: Verify exact source, reviewed kernel and pure contracts
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd driver
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD^)" = ca021f1a2147daf6e846dfd22e4507a468042405
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$GITHUB_WORKSPACE/contract-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/contract-tmp"
          git diff --name-only HEAD^ HEAD | sort > "$TMPDIR/driver-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/ssh-drained-close/driver.py validation/ssh-drained-close/reviewed-92198-full.py.txt validation/ssh-drained-close/source.json validation/ssh-drained-close/test-codex-usage-440-driver.py validation/ssh-drained-close/test_driver.py validation/ssh-drained-close/verify-codex-usage-440.py | sort | diff - "$TMPDIR/driver-files"
          echo '2a458024ce5d76e671df0bab069274110a59dcd8df5f93628812320248670bb2  validation/ssh-drained-close/driver.py' | sha256sum -c -
          echo 'f4668f021f9ea7354d1845c89a0f51b6b43b8b8d208abb68f69e510bf031f017  validation/ssh-drained-close/reviewed-92198-full.py.txt' | sha256sum -c -
          echo 'd4f755accb06a703113462128d9dd7c447d06c6c9232c7d5ffb461747dc9e2c8  validation/ssh-drained-close/source.json' | sha256sum -c -
          echo '4475ca97db59ca4b778e32200704b565e4238c9d8861a65e602e395a825c0226  validation/ssh-drained-close/test-codex-usage-440-driver.py' | sha256sum -c -
          echo '6d48a3c0d415a6e56419ede87965b053168d5ad4bf9440876f8fcafb0759d75b  validation/ssh-drained-close/test_driver.py' | sha256sum -c -
          echo '9cf38152e91ba9b7b4aec21c87db758c886d3acb877c3017ecf7629115c94993  validation/ssh-drained-close/verify-codex-usage-440.py' | sha256sum -c -
          cd validation/ssh-drained-close
          python3 -B test-codex-usage-440-driver.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/admission-contracts.log"
          python3 -B test_driver.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/driver-contracts.log"
          python3 -B -c 'import os; from pathlib import Path; import driver; driver.verify_reused_kernel(); driver.verify_source(Path(os.environ["GITHUB_WORKSPACE"]) / "product"); print("SOURCE_AND_KERNEL_PASS")' | tee "$GITHUB_WORKSPACE/evidence/preflight.log"
          test "$((SHARED_DEADLINE_EPOCH - $(date +%s)))" -gt 5
          python3 -B verify-codex-usage-440.py --admission "$GITHUB_WORKSPACE" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/initial-admission.log"
      - uses: dtolnay/rust-toolchain@master
        timeout-minutes: 10
        with:
          toolchain: 1.99.1
      - name: Install actual Linux Tauri test dependencies within remaining budget
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s) - 5))
          test "$remaining" -gt 0
          if [ "$remaining" -gt 600 ]; then remaining=600; fi
          timeout --signal=TERM --kill-after=10s "${remaining}s" bash -euo pipefail -c 'sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev' 2>&1 | tee evidence/setup.log
      - name: Record pinned toolchain and single shared deadline
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | cut -d' ' -f2)" = 1.99.1
          test "$(cargo --version | cut -d' ' -f2)" = 1.99.1
          { rustc --version; cargo --version; git -C driver rev-parse HEAD; git -C product rev-parse HEAD HEAD^{tree}; printf 'SHARED_DEADLINE_EPOCH=%s\n' "$SHARED_DEADLINE_EPOCH"; df -h; } | tee evidence/environment.log
      - name: One fresh actual Tauri lib binary and sealed 13 plus 3 inventory
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 5
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 -B driver/validation/ssh-drained-close/driver.py product evidence "${{ inputs.expected_sha }}" 2>&1 | tee evidence/driver.log
      - name: Preserve source, actual tests, binary identity and cleanup evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-drained-close-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
