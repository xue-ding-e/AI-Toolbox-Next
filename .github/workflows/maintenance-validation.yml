name: Isolated upstream Responses reasoning item ID validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  reasoning-item-ids:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/reasoning-item-ids-upstream'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - name: Start bounded validation clock
        run: echo "VALIDATION_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: coulsontl/ai-toolbox
          ref: c9bcc6c0334503a76aeb5ce2733fdad11d673dd5
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo '635f3c597d8959b6fde4ef839d21f6db47aaf218334812857a907744e31203a8  validation/candidate.diff' | sha256sum -c -
          echo 'ecc44cce94294074a6e5c2c8fab9cffc5c2f009c0fbb3d6ed05e157b5999fff2  validation/manifest.json' | sha256sum -c -
          echo '0e32805c3d746e5d0bd5fea37ca982c820040c56b583761bce209939a7921d67  validation/validate.py' | sha256sum -c -
      - name: Exact upstream candidate GREEN and complete transformer inventory
        timeout-minutes: 33
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reasoning-item-ids-upstream-evidence
          path: |
            ${{ runner.temp }}/reasoning-item-ids-upstream-evidence/*.log
            ${{ runner.temp }}/reasoning-item-ids-upstream-evidence/*.json
            ${{ runner.temp }}/reasoning-item-ids-upstream-evidence/*.diff
          retention-days: 7
