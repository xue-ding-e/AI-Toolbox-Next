name: Isolated OpenClaw provider order validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  openclaw-order-roundtrip:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/openclaw-order-roundtrip'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - name: Start bounded validation clock and incomplete evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "VALIDATION_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/openclaw-order-evidence"
          printf '%s\n' '{"status":"incomplete","stage":"checkout-or-bootstrap-not-completed"}' > "$RUNNER_TEMP/openclaw-order-evidence/result.json"
          printf '%s\n' '[]' > "$RUNNER_TEMP/openclaw-order-evidence/processes.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e222d60165c78addeab4a74ad3e2964600ee7f31
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify reviewed harness and run bounded real library RED then GREEN
        timeout-minutes: 43
        shell: bash
        run: |
          python3 - <<'CHECK'
          import hashlib, json, os, runpy
          from pathlib import Path
          expected = {
              "scripts/validate-openclaw-order.py": "99b64e47bcd7a6ca1465f68a87ec4ee38e474ca118afaa820f812467a0e93b94",
              "scripts/fixtures/openclaw-order-candidate.rs": "e2303c973ae7461ec81362e1bec0a8ebcd1b6c0d9de698013ff4be38060157b5",
              "scripts/fixtures/openclaw-order-production.diff": "72532aa510cf5fe5b04db7a8de3f19e698dda888557b4ae6dfcc8eaa8cf312c1",
          }
          try:
              for relative, wanted in expected.items():
                  path = Path("harness") / relative
                  assert not path.is_symlink() and hashlib.sha256(path.read_bytes()).hexdigest() == wanted, relative
          except BaseException as error:
              result = Path(os.environ["RUNNER_TEMP"]) / "openclaw-order-evidence/result.json"
              result.write_text(json.dumps({"status": "failed", "stage": "bootstrap-hash-verification", "error": str(error)}) + "\n")
              raise
          runpy.run_path("harness/scripts/validate-openclaw-order.py", run_name="__main__")
          CHECK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openclaw-order-evidence
          path: |
            ${{ runner.temp }}/openclaw-order-evidence/*.log
            ${{ runner.temp }}/openclaw-order-evidence/*.json
            ${{ runner.temp }}/openclaw-order-evidence/*.diff
          retention-days: 7
          if-no-files-found: error
