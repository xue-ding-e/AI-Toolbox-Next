name: Isolated Grok fetched-model metadata regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  grok:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/grok-fetched-models'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4bbbc8c477f0cfc1fe61080f1161f1b9b8882a83
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'aa896b0e053d5897138315e77171da82ef303e51ed0f6a2ad17ebcb7741cb791  validation/candidate.diff' | sha256sum -c -
          echo '31462568408146ad703d4cc7d04349722473ae8fce5e42d5a081a8e622a64791  validation/manifest.json' | sha256sum -c -
          echo '2d181b9cfd009c884476911f0d3475b20e5c3d7337593ee5babaa285ec06a7e5  validation/validate.py' | sha256sum -c -
      - name: Record existing official browser and fixed JS tools
        run: |
          node --version
          pnpm --version
          google-chrome --version
      - name: Exact-source RED GREEN and full TypeScript
        timeout-minutes: 22
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grok-fetched-models-evidence
          path: |
            ${{ runner.temp }}/grok-fetch-evidence/*.log
            ${{ runner.temp }}/grok-fetch-evidence/*.json
            ${{ runner.temp }}/grok-fetch-evidence/*.diff
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/grok-fetched-cases.json
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/results.json
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/failure.html
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/failure.png
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/case-*-failure.html
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/case-*-failure.png
          retention-days: 7
