# Branch-only control draft. Existing registered path; enabled state unknown.
# AI-assisted test infrastructure; no product authorship or release claim.
name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed control commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  context-response-timeout:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/context-response-timeout-fixture-20261029' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 17
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Start shared 15-minute budget before checkout and setup
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/context-response-timeout-evidence"
          python3 -c 'import os,time,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"context-response-timeout-evidence"/"started").write_text(str(time.time()))'
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source, control and patch before toolchain setup
        timeout-minutes: 1
        run: python3 scripts/context-response-timeout-validation/validate.py --preflight
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Compile independent automation target and run four selected tests
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # No APT, Tauri, tool credentials, real HOME or Cargo configuration.
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          command -v cc
          seconds=$(python3 -c 'import os,time,pathlib; start=float((pathlib.Path(os.environ["RUNNER_TEMP"])/"context-response-timeout-evidence"/"started").read_text()); left=int(900-(time.time()-start)-10); assert 0 < left <= 890; print(left)')
          # Cover Python filesystem scans too, reserving 10s for TERM/KILL cleanup.
          timeout --signal=TERM --kill-after=5s "${seconds}s" python3 scripts/context-response-timeout-validation/validate.py --validate
      - name: Retain bounded synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: context-response-timeout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-response-timeout-evidence
          retention-days: 7
          if-no-files-found: error
