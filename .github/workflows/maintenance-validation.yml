name: Grok editor component validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  component:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/grok-editor-component-r3' && github.sha == inputs.expected_sha
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Start shared wall clock
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 1380 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: harness
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          ref: aaafdea703c00be61f53a4982f4972e351fd5223
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Verify sealed inputs and apply six-file fixture
        shell: bash
        run: |
          set -euo pipefail
          cd harness
          test "$(git rev-parse HEAD^)" = ed056b3219966728f13fb6061703f97924f713f9
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/grok-harness-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/grok-editor/candidate.patch validation/grok-editor/source.json validation/grok-editor/validate.py | sort | diff - "$RUNNER_TEMP/grok-harness-files"
          cd validation/grok-editor
          echo 'd995f9eb17e3c1632aba23edcab35fb94965b7accab0d73e072ea83e8b94300c  candidate.patch' | sha256sum -c -
          echo '8ef35e28c49cd179b85cd7b89cf764b2184833adf26e71e0d3d92ca4c3c865e9  source.json' | sha256sum -c -
          echo 'b57db30a6b8beae7a91250fe3f0c882873512aec008db5a2404d7c9f2481828a  validate.py' | sha256sum -c -
          cd "$GITHUB_WORKSPACE/source"
          git apply --check "$GITHUB_WORKSPACE/harness/validation/grok-editor/candidate.patch"
          git apply "$GITHUB_WORKSPACE/harness/validation/grok-editor/candidate.patch"
          test -x /usr/bin/google-chrome
      - name: One supervised synthetic component attempt
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 120
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 harness/validation/grok-editor/validate.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-editor-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
