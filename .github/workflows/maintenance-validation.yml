# Prepared only: parent must review these four fixed harness files before any dispatch.
# The one shared 37-minute clock starts before toolchain/APT setup. Command
# ceilings never reset it. The 45-minute job reserves checkout/upload/cleanup.
name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation commit SHA (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  typed-context-admission:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/typed-context-admission-e49-stage1-20261028' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify sealed four-file harness before any setup
        timeout-minutes: 2
        run: python3 scripts/typed-context-admission-validation/validate.py --phase preflight
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.99.1
      - name: Install existing official Ubuntu compile prerequisites within shared budget
        timeout-minutes: 6
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/typed-context-admission-evidence"
          seconds=$(python3 - "$evidence/preflight-budget.json" <<'PY'
          import json,sys,time
          remaining=int(json.load(open(sys.argv[1]))['deadline_monotonic']-time.monotonic()-100)
          if remaining <= 0: raise SystemExit('shared setup/validation cleanup reserve reached')
          print(min(290,remaining))
          PY
          ) || exit $?
          # Only Ubuntu-signed official archives. Never use third-party runner
          # sources, add a signing key/repository, or bypass signature checks.
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe restricted multiverse' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe restricted multiverse' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main universe restricted multiverse' \
            > "$evidence/dependencies-ubuntu.list"
          wrapper_status=null
          write_dependencies_summary() {
            python3 - "$evidence" "$wrapper_status" "$seconds" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def status(name):
              path=root/('dependencies-'+name+'.exit')
              return int(path.read_text()) if path.exists() else None
          value={'wrapper_exit':None if sys.argv[2]=='null' else int(sys.argv[2]),
                 'update_exit':status('update'),'install_exit':status('install'),
                 'update_apt_exit':status('update-apt'),'install_apt_exit':status('install-apt'),
                 'update_capture_exit':status('update-capture'),'install_capture_exit':status('install-capture'),
                 'update_log_limit_hit':status('update-limit-hit'),'install_log_limit_hit':status('install-limit-hit'),
                 'log_mode':'combined stdout and stderr per APT command',
                 'log_limit_bytes_per_command':16777216,
                 'apt_term_after_seconds':int(sys.argv[3]),
                 'total_apt_timeout_including_kill_grace_seconds':int(sys.argv[3])+10,
                 'failure_class':'setup failure or timeout, not product RED',
                 'cleanup_boundary':'root GNU timeout plus job boundary; not unprivileged pidfd proof'}
          (root/'dependencies-summary.json').write_text(json.dumps(value,indent=2)+'\n')
          PY
          }
          trap write_dependencies_summary EXIT
          # Root apt is distinct from the unprivileged owned-process guarantee.
          # One timeout covers update plus install, including any wait/retry.
          if sudo -n timeout --signal=TERM --kill-after=10s "${seconds}s" bash -c '
            set -uo pipefail
            e="$1"
            options=(-o "Dir::Etc::sourcelist=$e/dependencies-ubuntu.list" -o "Dir::Etc::sourceparts=-" -o "Acquire::Retries=0" -o "Acquire::https::Timeout=20")
            # Bound only the captured output stream, never APT index/package files.
            run_apt() {
              local phase="$1"
              shift
              local output="$e/dependencies-$phase.combined.log"
              local statuses
              apt-get "${options[@]}" "$@" 2>&1 | head -c 16777216 > "$output"
              statuses=("${PIPESTATUS[@]}")
              printf "%s\n" "${statuses[0]}" > "$e/dependencies-$phase-apt.exit"
              printf "%s\n" "${statuses[1]}" > "$e/dependencies-$phase-capture.exit"
              if test "$(wc -c < "$output")" -ge 16777216; then
                printf "1\n" > "$e/dependencies-$phase-limit-hit.exit"
                return 125
              fi
              printf "0\n" > "$e/dependencies-$phase-limit-hit.exit"
              test "${statuses[1]}" -eq 0 || return "${statuses[1]}"
              return "${statuses[0]}"
            }
            if run_apt update update; then update_status=0; else update_status=$?; fi
            printf "%s\n" "$update_status" > "$e/dependencies-update.exit"
            test "$update_status" -eq 0 || exit "$update_status"
            if run_apt install install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev; then install_status=0; else install_status=$?; fi
            printf "%s\n" "$install_status" > "$e/dependencies-install.exit"
            exit "$install_status"
          ' bash "$evidence"; then
            wrapper_status=0
          else
            wrapper_status=$?
          fi
          exit "$wrapper_status"
      - name: Compile frozen locked source and run exact Stage 1 controls
        timeout-minutes: 37
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/typed-context-admission-evidence"
          seconds=$(python3 - "$evidence/preflight-budget.json" <<'PY_CLOCK'
          import json,sys,time
          remaining=int(json.load(open(sys.argv[1]))['deadline_monotonic']-time.monotonic())
          # TERM at least 15 seconds before the original deadline; KILL grace
          # is ten seconds, leaving five seconds before that same deadline.
          if remaining <= 15: raise SystemExit('original shared deadline exhausted; validation not started')
          print(remaining-15)
          PY_CLOCK
          ) || exit $?
          wrapper_status=null
          write_validation_summary() {
            python3 - "$evidence" "$wrapper_status" "$seconds" <<'PY_WRAPPER'
          import json,pathlib,sys,time
          root=pathlib.Path(sys.argv[1])
          deadline=json.loads((root/"preflight-budget.json").read_text())["deadline_monotonic"]
          code=None if sys.argv[2]=="null" else int(sys.argv[2])
          result={"wrapper_exit":code,"term_after_seconds":int(sys.argv[3]),
                  "kill_grace_seconds":10,"original_deadline_monotonic":deadline,
                  "finished_monotonic":time.monotonic(),"shared_budget_was_not_reset":True,
                  "completed_within_deadline":code==0 and time.monotonic()<=deadline,
                  "timeout_or_unknown_is_incomplete_not_product_red":code!=0,
                  "forced_kill_cleanup_guarantee":"Unconfirmed descendants/fixtures retained; runner job is outer containment"}
          (root/"validation-wrapper.json").write_text(json.dumps(result,indent=2)+"\n")
          PY_WRAPPER
          }
          trap write_validation_summary EXIT
          if timeout --signal=TERM --kill-after=10s "${seconds}s" python3 scripts/typed-context-admission-validation/validate.py --phase validation; then
            wrapper_status=0
          else
            wrapper_status=$?
          fi
          exit "$wrapper_status"
      - name: Upload only source and bounded evidence, never caches or credentials
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: typed-context-admission-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/typed-context-admission-evidence/preflight-*.json
            ${{ runner.temp }}/typed-context-admission-evidence/preflight-*.log
            ${{ runner.temp }}/typed-context-admission-evidence/dependencies-*.json
            ${{ runner.temp }}/typed-context-admission-evidence/dependencies-*.log
            ${{ runner.temp }}/typed-context-admission-evidence/validation-*.json
            ${{ runner.temp }}/typed-context-admission-evidence/validation-*.log
            ${{ runner.temp }}/typed-context-admission-evidence/validation-*.patch
          if-no-files-found: error
          retention-days: 7
