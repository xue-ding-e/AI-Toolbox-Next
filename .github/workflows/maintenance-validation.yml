name: Isolated Claude Desktop official-edit validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  official-edit:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/claude-desktop-official-edit'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      HUSKY: '0'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f3a84498b5e192f1e78cb2a5312be012095de76c
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify the reviewed four-file harness
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'e2028b6cc64ab4c119f5caa69b68027242afcd45a71acbf9f4e51223f29e5bdf  validation/candidate.diff' | sha256sum -c -
          echo '08225f03d9d0bb703cd09f7b16f964151bc4c659b4b006cca2c9615fb47a3c7b  validation/manifest.json' | sha256sum -c -
          echo '06c2067288a131c1c480fb547cea135d7f49f6783d4ff97d0ce56d9a66c3f45b  validation/validate.py' | sha256sum -c -
      - name: Official Ubuntu CJK fonts and available Chrome
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if ! dpkg-query -W -f='${Status}' fonts-noto-cjk 2>/dev/null | grep -Fxq 'install ok installed'; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi
          dpkg-query -W fonts-noto-cjk
          fc-match -f '%{family}\n' ':lang=zh-cn' | grep Noto
          google-chrome --version
      - name: Fixed-source helper, full TypeScript and RED-GREEN browser validation
        timeout-minutes: 26
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: claude-desktop-official-edit-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/official-edit-evidence/*.log
            ${{ runner.temp }}/official-edit-evidence/*.json
            ${{ runner.temp }}/official-edit-evidence/reviewed-candidate.diff
            ${{ runner.temp }}/official-edit-evidence/tested.diff
            ${{ runner.temp }}/official-edit-evidence/cases/*.json
            ${{ runner.temp }}/official-edit-evidence/browser/preflight.json
            ${{ runner.temp }}/official-edit-evidence/browser/prepared-manifest.json
            ${{ runner.temp }}/official-edit-evidence/browser/results.json
            ${{ runner.temp }}/official-edit-evidence/browser/red/strict-results.json
            ${{ runner.temp }}/official-edit-evidence/browser/red/strict-failure.json
            ${{ runner.temp }}/official-edit-evidence/browser/red/results.json
            ${{ runner.temp }}/official-edit-evidence/browser/red/failure.html
            ${{ runner.temp }}/official-edit-evidence/browser/red/failure.png
            ${{ runner.temp }}/official-edit-evidence/browser/red/screenshots/red-official-both-notes-initialized.png
            ${{ runner.temp }}/official-edit-evidence/browser/green/strict-results.json
            ${{ runner.temp }}/official-edit-evidence/browser/green/strict-failure.json
            ${{ runner.temp }}/official-edit-evidence/browser/green/results.json
            ${{ runner.temp }}/official-edit-evidence/browser/green/failure.html
            ${{ runner.temp }}/official-edit-evidence/browser/green/failure.png
            ${{ runner.temp }}/official-edit-evidence/browser/green/screenshots/green-official-both-notes-initialized.png
            ${{ runner.temp }}/official-edit-evidence/browser/green/screenshots/green-pure-restore-notes-before-save.png
            ${{ runner.temp }}/official-edit-evidence/browser/green/screenshots/green-url-only-added-space-key-validation-error.png
