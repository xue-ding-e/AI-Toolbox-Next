name: Isolated Skills grouping preference validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  skills:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/skills-group-mode'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 268a567b93fecfd4c5f889a13b6d1c56f86e3c92
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'c72918d5333950f9b2d0af92ce66c71da0eaf650e7ab3c31cadcb0757427997e  validation/candidate.diff' | sha256sum -c -
          echo '898b4d3c65001b052fee480a13a68716279bc107d8a43d7fe516005ddcca98fd  validation/manifest.json' | sha256sum -c -
          echo '6806f9afede8b6c17ecf1d872326b9bf32f28562837eab579e6e0489e97c3f36  validation/validate.py' | sha256sum -c -
      - name: Official prerequisites and fixed Rust
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          google-chrome --version
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
          rustup toolchain install 1.99.1 --profile minimal
      - name: Real SkillsPage, full TypeScript and serial exact Rust library tests
        timeout-minutes: 42
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skills-group-mode-evidence
          path: |
            ${{ runner.temp }}/skills-group-evidence/*.log
            ${{ runner.temp }}/skills-group-evidence/*.json
            ${{ runner.temp }}/skills-group-evidence/*.diff
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/skills-group-cases.json
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/results.json
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/failure.html
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/failure.png
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/case-*-failure.html
            ${{ runner.temp }}/skills-group-evidence/browser/skills-group-mode-*/case-*-failure.png
          retention-days: 7
