# DRAFT: 2+2+3+8+25+3 = 43 minutes of step ceilings, below the 45 minute job.
# DRAFT: replace the registered workflow ONLY on the isolated validation branch.
# This intentionally does not validate frontend/UI, install the app, or publish.
name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation branch commit SHA (40 lowercase hex)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  configonly-desktop:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/codex-configonly-desktop' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify reviewed source before setup
        timeout-minutes: 2
        run: python3 scripts/configonly-desktop-validation/validate.py --phase preflight --manifest scripts/configonly-desktop-validation/candidate.json
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.99.1
      - name: Install existing Linux compile prerequisites only
        timeout-minutes: 8
        # Existing official apt prerequisites only. Root GNU timeout handles
        # apt timeout cleanup; the job is the final containment boundary. This
        # is NOT the unprivileged build/test owned-process evidence guarantee.
        shell: bash
        run: |
          set -uo pipefail
          evidence="$RUNNER_TEMP/configonly-desktop-evidence"
          ulimit -f 32768
          update_status=null
          install_status=null
          trap 'printf "{\"update_exit\":%s,\"install_exit\":%s,\"cleanup_boundary\":\"root GNU timeout and job hard limit; not independently verified\"}\n" "$update_status" "$install_status" > "$evidence/dependencies-summary.json"' EXIT
          if sudo -n timeout --signal=TERM --kill-after=10s 120s apt-get update > "$evidence/dependencies-apt-update.stdout.log" 2> "$evidence/dependencies-apt-update.stderr.log"; then
            update_status=0
          else
            update_status=$?
          fi
          test "$update_status" -eq 0 || exit "$update_status"
          if sudo -n timeout --signal=TERM --kill-after=10s 300s apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev > "$evidence/dependencies-apt-install.stdout.log" 2> "$evidence/dependencies-apt-install.stderr.log"; then
            install_status=0
          else
            install_status=$?
          fi
          exit "$install_status"
      - name: Compile real desktop library and run four old pure-memory controls
        timeout-minutes: 25
        run: python3 scripts/configonly-desktop-validation/validate.py --phase validation --manifest scripts/configonly-desktop-validation/candidate.json
      - name: Upload whitelisted evidence, never target or credentials
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: configonly-desktop-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/configonly-desktop-evidence/preflight-*.json
            ${{ runner.temp }}/configonly-desktop-evidence/dependencies-*.json
            ${{ runner.temp }}/configonly-desktop-evidence/validation-*.json
            ${{ runner.temp }}/configonly-desktop-evidence/preflight-*.log
            ${{ runner.temp }}/configonly-desktop-evidence/dependencies-*.log
            ${{ runner.temp }}/configonly-desktop-evidence/validation-*.log
          if-no-files-found: error
          retention-days: 7
