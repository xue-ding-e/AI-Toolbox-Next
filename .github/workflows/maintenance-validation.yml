name: Isolated Grok fetched-model metadata regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  grok:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/grok-fetched-models'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 5
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4bbbc8c477f0cfc1fe61080f1161f1b9b8882a83
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'd8f3e770f597e09146c042dee06a91901a4b8b4064bd5ffa6a45e665b79f781e  validation/candidate.diff' | sha256sum -c -
          echo '5ee02946055233ab56a288eafdfdc95565bce955d3711ff670b4b8cdfa85a54b  validation/manifest.json' | sha256sum -c -
          echo 'b91437078950dfe0cacb8c3eaecd0287e973f5a2527d6a76e98ba7cee50d3750  validation/validate.py' | sha256sum -c -
      - name: Record existing official browser and fixed JS tools
        run: |
          node --version
          pnpm --version
          google-chrome --version
      - name: Exact-source RED GREEN and full TypeScript
        timeout-minutes: 22
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grok-fetched-models-evidence
          path: |
            ${{ runner.temp }}/grok-fetch-evidence/*.log
            ${{ runner.temp }}/grok-fetch-evidence/*.json
            ${{ runner.temp }}/grok-fetch-evidence/*.diff
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/grok-fetched-cases.json
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/results.json
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/failure.html
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/failure.png
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/case-*-failure.html
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/case-*-failure.png
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/*.js
            ${{ runner.temp }}/grok-fetch-evidence/*/grok-fetched-models-*/*.js.map
            ${{ runner.temp }}/grok-fetch-evidence/*.sha256
          retention-days: 7
