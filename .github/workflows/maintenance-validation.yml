name: Card-fixture follow-up validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  migrated-cards-followup:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/upstream-cards-final-20261026' && github.sha == inputs.expected_sha
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Start shared 23-minute wall clock
        shell: bash
        run: echo "SHARED_DEADLINE_EPOCH=$(( $(date +%s) + 1380 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: driver
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: product
          ref: 7acb2ac95a765fd9966213c82daa2c12048a0a48
          fetch-depth: 4
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify sealed driver, exact product delta and lightweight contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.19.0
          test "$(pnpm --version)" = 9.15.0
          command -v google-chrome || command -v chromium || command -v chromium-browser
          cd driver
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD^)" = 44df94da569962c78710d9436339735da864fed6
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$GITHUB_WORKSPACE/contract-tmp"
          export TMPDIR="$GITHUB_WORKSPACE/contract-tmp"
          git diff --name-only HEAD^ HEAD | sort > "$TMPDIR/driver-files"
          printf '%s\n' .github/workflows/maintenance-validation.yml validation/cards-followup/driver.py validation/cards-followup/reviewed-92198-full.py.txt validation/cards-followup/source.json validation/cards-followup/test-codex-usage-440-driver.py validation/cards-followup/test_driver.py validation/cards-followup/verify-codex-usage-440.py | sort | diff - "$TMPDIR/driver-files"
          echo '0dbe680480fbed8044d47de0df7463ed61ef1a6143cbf18693dc63e32d101f4a  validation/cards-followup/driver.py' | sha256sum -c -
          echo 'f4668f021f9ea7354d1845c89a0f51b6b43b8b8d208abb68f69e510bf031f017  validation/cards-followup/reviewed-92198-full.py.txt' | sha256sum -c -
          echo '9fec00d6672c2fe70d6429a61eb93703f96bbfe71c5950a117c0d44487008bb4  validation/cards-followup/source.json' | sha256sum -c -
          echo '4475ca97db59ca4b778e32200704b565e4238c9d8861a65e602e395a825c0226  validation/cards-followup/test-codex-usage-440-driver.py' | sha256sum -c -
          echo '8b7ca86f568514447e4ea0e3edf9120e8dd75b35bca089589b60e321720a7ac8  validation/cards-followup/test_driver.py' | sha256sum -c -
          echo '9cf38152e91ba9b7b4aec21c87db758c886d3acb877c3017ecf7629115c94993  validation/cards-followup/verify-codex-usage-440.py' | sha256sum -c -
          cd validation/cards-followup
          python3 -B test-codex-usage-440-driver.py
          python3 -B test_driver.py
          python3 -B -c 'import os; from pathlib import Path; import driver; p=Path(os.environ["GITHUB_WORKSPACE"]) / "product"; driver.verify_source(p); driver.verify_reuse_boundary(p)'
      - name: Fetch the exact failed-run artifact, read-only and bounded
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 5
          timeout --signal=TERM --kill-after=5s "$((remaining - 5))s" gh api repos/xue-ding-e/AI-Toolbox-Next/actions/artifacts/12641307995/zip > evidence/prior-artifact.zip
          test "$(stat -c %s evidence/prior-artifact.zip)" = 354247
          echo 'b75a7115af84ff70367d983e1988c025255a2a55696a17d5831e13ed0e8920a5  evidence/prior-artifact.zip' | sha256sum -c -
      - name: Three sealed follow-up stages, no Rust rebuild
        shell: bash
        run: |
          set -euo pipefail
          remaining=$((SHARED_DEADLINE_EPOCH - $(date +%s)))
          test "$remaining" -gt 5
          timeout --signal=TERM --kill-after=10s "$((remaining + 5))s" python3 -B driver/validation/cards-followup/driver.py product evidence "${{ inputs.expected_sha }}" 2>&1 | tee evidence/driver.log
      - name: Preserve combined source, browser, prior and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-cards-followup-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 7
