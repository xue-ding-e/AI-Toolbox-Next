name: Maintenance validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  capsule-model-interop:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/magpie-capsule-model'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Initialize synthetic model verification evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/magpie-evidence"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'magpie-evidence'
          for phase in ('suite', 'prepare', 'rust-toolchain', 'resolve', 'fetch', 'green', 'race', 'oracle', 'verify'):
              (out / (phase + '.json')).write_text(json.dumps({'phase': phase, 'not_run': True, 'exit_code': None}) + '\n')
          (out / 'source.json').write_text(json.dumps({key: os.environ[key] for key in ('GITHUB_REPOSITORY', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_EVENT_NAME')}) + '\n')
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: validation
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify reviewed isolated source and harness manifest
        shell: bash
        working-directory: validation
        run: |
          set -euo pipefail
          echo 'e40a7c91bb8572d2ada335babb6cb8019ca9028d16e944d627552ecefa8aabf0  payload.sha256' | sha256sum -c -
          sha256sum -c payload.sha256
          cp payload.sha256 "$RUNNER_TEMP/magpie-evidence/"
          sha256sum .github/workflows/maintenance-validation.yml > "$RUNNER_TEMP/magpie-evidence/workflow.sha256"
      - name: Run frozen Go tests and separate serde model oracle
        timeout-minutes: 25
        shell: bash
        run: python3 validation/supervise.py
      - name: Retain original logs results exits and formatted copies
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: magpie-capsule-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/magpie-evidence/
          if-no-files-found: error
          retention-days: 7
