# Isolated reviewed validation branch only. No push/PR trigger or release job.
name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed validation SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  codex-configonly-effects:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/codex-configonly-effect' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.99.1
          components: rustfmt
      - name: Format only three new modules and validate fixed synthetic effects
        timeout-minutes: 11
        run: python3 scripts/configonly-effect-validation/validate.py
      - name: Upload bounded evidence and exact formatted source
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: configonly-effect-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/configonly-effect-evidence/validation-*.json
            ${{ runner.temp }}/configonly-effect-evidence/validation-*.log
            ${{ runner.temp }}/configonly-effect-evidence/validation-tested.patch
            ${{ runner.temp }}/configonly-effect-evidence/validation-formatted-codex_master.rs
            ${{ runner.temp }}/configonly-effect-evidence/validation-formatted-codex_service.rs
            ${{ runner.temp }}/configonly-effect-evidence/validation-formatted-config_file.rs
          if-no-files-found: error
          retention-days: 7
