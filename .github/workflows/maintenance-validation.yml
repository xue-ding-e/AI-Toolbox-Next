name: Maintenance validation
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  coordination-lock:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.ref == 'refs/heads/validation/coordination-artifact-lock' && github.event_name == 'workflow_dispatch' && inputs.expected_sha == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 1
        with:
          toolchain: 1.99.1
      - name: Resolve only the management path-package lock edge
        timeout-minutes: 2
        run: python3 scripts/coordination-lock-validation/validate.py --phase validation --manifest scripts/coordination-lock-validation/candidate.json
      - name: Upload public lock resolution evidence only
        if: always()
        uses: actions/upload-artifact@v4
        timeout-minutes: 1
        with:
          name: coordination-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coordination-lock-evidence/validation-*.json
            ${{ runner.temp }}/coordination-lock-evidence/validation-*.log
            ${{ runner.temp }}/coordination-lock-evidence/validation-*.lock
            ${{ runner.temp }}/coordination-lock-evidence/validation-*.diff
          if-no-files-found: error
          retention-days: 7
