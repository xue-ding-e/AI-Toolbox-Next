name: Maintenance validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false

jobs:
  codex-credits-frontend-comparison:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/codex-credits-frontend-comparison'
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23b35d815cc5899d0d4f70d872a403ca5fe68f57
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f9c67622f59a53707ef1cd463771485b3f13bd79
          path: candidate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Record both exact trees and shared environment
        run: |
          git -C baseline rev-parse HEAD 'HEAD^{tree}'
          git -C candidate rev-parse HEAD 'HEAD^{tree}'
          node --version
          pnpm --version
          google-chrome --version
          free -m
          df -h
      - name: Install baseline locked dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile
      - name: Install candidate locked dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Compare full SSH fixture then finish unrun frontend gates
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          run_check() {
            label="$1"
            directory="$2"
            shift 2
            echo "::group::$label"
            if (cd "$directory" && "$@"); then
              echo "RESULT $label: PASS"
            else
              code=$?
              echo "RESULT $label: FAIL (exit $code)"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          }
          # The fixture's 'baseline' environment mode skips the race cases;
          # leave it unset so both commits exercise the exact same full suite.
          run_check baseline-ssh baseline pnpm run test:ssh-capability
          run_check candidate-ssh candidate pnpm run test:ssh-capability
          run_check candidate-skills-group-mode candidate pnpm run test:skills-group-mode
          run_check candidate-claude-desktop-official-edit candidate pnpm run test:claude-desktop-official-edit
          run_check candidate-operation-inventory candidate pnpm run test:operation-inventory
          run_check candidate-production-build candidate pnpm build
          # Capture every result without turning either commit's failure green.
          test "$failed" -eq 0
