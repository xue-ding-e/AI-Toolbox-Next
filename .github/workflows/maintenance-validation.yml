name: Isolated SSH capability contract validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  ssh:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ssh-capability-report'
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 459b34a65039d93209c02efe10985d91b3caeda2
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'e1eff0a594ffb54f8bdd1a0789441e1375e1a4c3e1e9ab19a990e2d0edb44ded  validation/candidate.diff' | sha256sum -c -
          echo '7201f06e3cc94194d8b7da4074c289b9c3fe9c1302d8e5cb6c26718392f81bee  validation/manifest.json' | sha256sum -c -
          echo '21dbf83ebb45c68339fda907969cbe73db8715f71de2c37121908c43f97533f1  validation/validate.py' | sha256sum -c -
      - name: Official prerequisites and fixed Rust
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          google-chrome --version
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
          rustup toolchain install 1.99.1 --profile minimal
      - name: Synthetic baseline contract, full browser, TypeScript and exact Rust tests
        timeout-minutes: 47
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-capability-evidence
          path: |
            ${{ runner.temp }}/ssh-capability-evidence/*.log
            ${{ runner.temp }}/ssh-capability-evidence/*.json
            ${{ runner.temp }}/ssh-capability-evidence/*.diff
            ${{ runner.temp }}/ssh-capability-evidence/*/*/*.json
            ${{ runner.temp }}/ssh-capability-evidence/*/*/failure.html
            ${{ runner.temp }}/ssh-capability-evidence/*/*/failure.png
            ${{ runner.temp }}/ssh-capability-evidence/*/*/case-*.html
            ${{ runner.temp }}/ssh-capability-evidence/*/*/case-*.png
            ${{ runner.temp }}/ssh-capability-evidence/*/*/capability-*.html
            ${{ runner.temp }}/ssh-capability-evidence/*/*/capability-*.png
            ${{ runner.temp }}/ssh-capability-evidence/*/*/baseline-*.html
            ${{ runner.temp }}/ssh-capability-evidence/*/*/baseline-*.png
          retention-days: 7
