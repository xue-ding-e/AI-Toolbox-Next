name: Isolated Skills save feedback regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  skills:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/skills-save-feedback'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 81ed352a837c213bfac900a975136ab83d28dbe9
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'b4911451e363efd655a5e4b7f12f969aefaad7f8d966e735e75e0beee7232404  validation/candidate.diff' | sha256sum -c -
          echo '147dfeb6562e33b440d91df9f4a063d945832de01a03ef4ab20018516e1f7336  validation/manifest.json' | sha256sum -c -
          echo '7a613005f2138bf66b346e4866448b6f3a3f0a8c5a2579678ff6b35d574cf5a9  validation/validate.py' | sha256sum -c -
      - name: Record existing official browser and fixed JS tools
        run: |
          node --version
          pnpm --version
          google-chrome --version
      - name: Exact-source RED GREEN and full TypeScript
        timeout-minutes: 22
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: skills-save-feedback-evidence
          path: |
            ${{ runner.temp }}/skills-save-evidence/*.log
            ${{ runner.temp }}/skills-save-evidence/*.json
            ${{ runner.temp }}/skills-save-evidence/*.diff
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/skills-group-cases.json
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/results.json
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/failure.html
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/failure.png
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/case-*-failure.html
            ${{ runner.temp }}/skills-save-evidence/*/skills-group-mode-*/case-*-failure.png
          retention-days: 7
