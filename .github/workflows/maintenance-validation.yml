name: UI preference service native validation
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  ui-preferences-read-linux:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ui-preferences-read-draft-20261031'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: c95f9ec1bc54904ea850a2e2f5b7166db681d6dd
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      CARGO_NET_RETRY: '1'
      CARGO_HTTP_TIMEOUT: '60'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: c95f9ec1bc54904ea850a2e2f5b7166db681d6dd
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt
    - name: Record source and synthetic native environment
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        mkdir -p "$RUNNER_TEMP/native-evidence" "$RUNNER_TEMP/native-home" "$RUNNER_TEMP/native-config" "$RUNNER_TEMP/native-local"

        printf ''%s\n'' "control=$GITHUB_SHA" "product=$SOURCE_SHA" "tree=$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/native-evidence/identity.txt"

        rustc --version | tee "$RUNNER_TEMP/native-evidence/toolchain.txt"

        cargo --version | tee -a "$RUNNER_TEMP/native-evidence/toolchain.txt"

        df -h | tee "$RUNNER_TEMP/native-evidence/disk.txt"

        free -m | tee "$RUNNER_TEMP/native-evidence/memory.txt"

        echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"

        echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"

        echo "CARGO_TARGET_DIR=$RUNNER_TEMP/native-target" >> "$GITHUB_ENV"

        for name in HOME USERPROFILE; do echo "$name=$RUNNER_TEMP/native-home" >> "$GITHUB_ENV"; done

        for name in APPDATA XDG_CONFIG_HOME; do echo "$name=$RUNNER_TEMP/native-config" >> "$GITHUB_ENV"; done

        for name in LOCALAPPDATA AI_TOOLBOX_DATA_DIR AI_TOOLBOX_CACHE_DIR XDG_DATA_HOME XDG_CACHE_HOME CODEX_HOME;
        do echo "$name=$RUNNER_TEMP/native-local/$name" >> "$GITHUB_ENV"; done

        sha256sum crates/ai-toolbox-storage/Cargo.lock crates/ai-toolbox-automation/Cargo.lock tauri/Cargo.lock
        > "$RUNNER_TEMP/native-evidence/locks.sha256"


        # Dependency resolution must equal the reviewed 0b8e83a product, not just remain stable during this run.

        cat > "$RUNNER_TEMP/native-evidence/baseline-locks.sha256" <<''LOCKS''

        cb14e4cabd3e074917823d8a33a86916540b8d26cbffc6a32cf5020e00ccdaf8  crates/ai-toolbox-storage/Cargo.lock

        5af5cd820a798b3de68b85e63999ca30f827ef7360871b5e7f12570ad67353ea  crates/ai-toolbox-automation/Cargo.lock

        d53be4aa14de37544f99f8bcd665c16b2547d97af00eaedc91a89d285123c1ae  tauri/Cargo.lock

        LOCKS

        sha256sum --check "$RUNNER_TEMP/native-evidence/baseline-locks.sha256"

        '
    - name: Verify reviewed tree, parent, exact allowlist and file hashes
      shell: bash
      run: 'node <<''NODE''

        const assert=require(''node:assert/strict''),fs=require(''node:fs''),crypto=require(''node:crypto''),cp=require(''node:child_process'');

        const git=(...args)=>cp.execFileSync(''git'',args,{encoding:''utf8''}).trim();

        const expected={"crates/ai-toolbox-storage/AGENTS.md": "ce196c302372ce354d5420eda282a99c99d81f7a4a3140bb1474e8bb4c17f4c6",
        "crates/ai-toolbox-storage/src/lib.rs": "aab376958f94ebc11136a52fb64089e913c156fb7469bd5d01d0f80a433b93c0",
        "crates/ai-toolbox-storage/src/ui_preferences.rs": "207456254d02f7daf80d5bb2fbb91400f2bd151ba71c4c914fe3372cdda2d28c",
        "crates/ai-toolbox-storage/src/ui_preferences/tests.rs": "261324f3706fef21825f9927d99f7a249ed383a3ae11861561973369c9da519f",
        "tauri/src/settings/AGENTS.md": "47e1f0cc8953839cae950ad03c369982301f5d29dc8e6ae2a3781f7f918ce3e1", "tauri/src/settings/adapter.rs":
        "fbc299d95e877b4e22aae5cae66f192756f42ab3a3a812c27bdc6fe640c6bcc0", "tauri/src/settings/commands.rs": "a9386859f1bb3221182307541da2b4662ec12f5dd21ecbf3156dc4319f09cf08",
        "tauri/src/settings/store.rs": "009d95d4a35567485901614cc93a4c997f244b8e80e9e64e8b5bbef49beece27", "tauri/src/settings/types.rs":
        "33510e949880bd4d88556649f150cf1ff3d5b5b2979b77f6d5685b45ff016909"};

        assert.equal(git(''rev-parse'',''HEAD''),''c95f9ec1bc54904ea850a2e2f5b7166db681d6dd'');

        assert.equal(git(''rev-parse'',''HEAD^{tree}''),''b6bbf47e85d8980610a1a38b43c690df74dcc682'');

        assert.equal(git(''rev-parse'',''HEAD^''),''f5e94d4043c9fa9d255570f21335f2f47e4d2307'');

        assert.equal(git(''rev-parse'',''HEAD^^''),''0b8e83aa2606a81ed7348855ed4acded1a7a377e'');

        assert.deepEqual(git(''diff'',''--name-only'',''0b8e83aa2606a81ed7348855ed4acded1a7a377e'',''HEAD'').split(''\n'').sort(),Object.keys(expected).sort());

        for(const [file,hash] of Object.entries(expected)) assert.equal(crypto.createHash(''sha256'').update(fs.readFileSync(file)).digest(''hex''),hash,file);

        assert.equal(git(''status'',''--porcelain''),'''');

        fs.writeFileSync(process.env.RUNNER_TEMP+''/native-evidence/reviewed-source.json'',JSON.stringify({source:''c95f9ec1bc54904ea850a2e2f5b7166db681d6dd'',tree:''b6bbf47e85d8980610a1a38b43c690df74dcc682'',base:''0b8e83aa2606a81ed7348855ed4acded1a7a377e'',files:expected},null,2));

        console.log(''Reviewed source tree, exact nine-file allowlist and content hashes verified'');

        NODE'
    - name: Prepare exact test-result checker
      run: "cat > \"$RUNNER_TEMP/check-ui-preferences.cjs\" <<'NODE'\nconst fs=require('node:fs'),assert=require('node:assert/strict');\n\
        const [mode,file,...expected]=process.argv.slice(2);\nconst text=fs.readFileSync(file,'utf8').replace(/\\\
        r/g,'');\nif(mode==='list') {\n const found=text.split('\\n').filter(x=>x.endsWith(': test')).map(x=>x.slice(0,-6));\n\
        \ assert.deepEqual(found.sort(),expected.sort());\n} else {\n const results=[...text.matchAll(/test result:\
        \ ok\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;/g)];\n assert.equal(results.length,1); assert.equal(+results[0][1],expected.length);\n\
        \ assert.equal(+results[0][2],0); assert.equal(+results[0][3],0);\n for(const name of expected) {\n  if(mode==='actor')\
        \ { assert(text.includes(`test ${name} ... `),name); assert(/^ok$/m.test(text)); }\n  else assert(text.split('\\\
        n').includes(`test ${name} ... ok`),name);\n }\n if(mode==='actor') assert(text.includes('synthetic-ui-preferences-registry-restored'));\n\
        }\nconsole.log(JSON.stringify({mode,expected_count:expected.length,names:expected,status:'verified'}));\n\
        NODE\n"
    - name: Require actual selected-source rustfmt success (no source mutation)
      timeout-minutes: 3
      run: 'set -euo pipefail

        rustfmt --version | tee -a "$RUNNER_TEMP/native-evidence/toolchain.txt"

        rustfmt --check --edition 2021 --config skip_children=true crates/ai-toolbox-storage/src/lib.rs crates/ai-toolbox-storage/src/ui_preferences.rs
        crates/ai-toolbox-storage/src/ui_preferences/tests.rs tauri/src/settings/types.rs tauri/src/settings/adapter.rs
        tauri/src/settings/store.rs tauri/src/settings/commands.rs 2>&1 | tee "$RUNNER_TEMP/native-evidence/format-check.log"

        '
      id: format
    - name: Preserve formatting proposal on copies only after format failure
      if: failure() && steps.format.outcome == 'failure'
      shell: bash
      timeout-minutes: 3
      run: 'node <<''NODE''

        const fs=require(''node:fs''),path=require(''node:path''),cp=require(''node:child_process''),assert=require(''node:assert/strict'');

        const evidence=path.join(process.env.RUNNER_TEMP,''native-evidence'');

        const reviewed=JSON.parse(fs.readFileSync(path.join(evidence,''reviewed-source.json''),''utf8''));

        const files=Object.keys(reviewed.files).filter(f=>f.endsWith(''.rs''));

        const output=path.join(evidence,''formatted-source-for-review'');

        for(const file of files) { const dst=path.join(output,file); fs.mkdirSync(path.dirname(dst),{recursive:true});fs.copyFileSync(file,dst);
        }

        const result=cp.spawnSync(''rustfmt'',[''--edition'',''2021'',''--config'',''skip_children=true'',...files.map(f=>path.join(output,f))],{encoding:''utf8''});

        fs.writeFileSync(path.join(evidence,''format-copy.log''),(result.stdout||'''')+(result.stderr||'''')+(result.error?String(result.error):''''));

        fs.writeFileSync(path.join(evidence,''format-status.json''),JSON.stringify({source:reviewed.source,check:''failed'',copy_format_exit:result.status,compiled:false,rust_tests:''not
        run'',outputs:''review only; never tested as original source''},null,2));

        assert.equal(cp.execFileSync(''git'',[''status'',''--porcelain''],{encoding:''utf8''}).trim(),'''');

        if(result.error || result.status!==0) process.exit(1);

        NODE'
    - name: Install existing Linux native prerequisites
      timeout-minutes: 10
      run: 'sudo apt-get update

        sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev'
    - name: Compile fixed source and verify six shared plus two desktop regressions and recovery actor
      timeout-minutes: 65
      run: 'set -euo pipefail

        cargo test --locked --manifest-path crates/ai-toolbox-storage/Cargo.toml --lib ui_preferences::tests:: --
        --list 2>&1 | tee "$RUNNER_TEMP/native-evidence/shared-selection.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" list "$RUNNER_TEMP/native-evidence/shared-selection.log" ui_preferences::tests::missing_record_reads_defaults_without_creating_or_writing
        ui_preferences::tests::existing_partial_values_preserve_tolerant_decoding_and_dynamic_keys ui_preferences::tests::missing_null_and_wrong_type_blocks_keep_the_original_distinctions
        ui_preferences::tests::unrelated_secret_fields_never_enter_the_read_projection ui_preferences::tests::readers_use_the_supplied_connections_uncommitted_transaction
        ui_preferences::tests::unavailable_storage_reports_only_the_static_read_error

        cargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_
        -- --list 2>&1 | tee "$RUNNER_TEMP/native-evidence/desktop-selection.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" list "$RUNNER_TEMP/native-evidence/desktop-selection.log" settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection
        settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure settings::store::tests::narrow_ui_preference_registry_actor

        cargo test --locked --manifest-path crates/ai-toolbox-storage/Cargo.toml --lib ui_preferences::tests:: --
        --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-evidence/shared-run.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" run "$RUNNER_TEMP/native-evidence/shared-run.log" ui_preferences::tests::missing_record_reads_defaults_without_creating_or_writing
        ui_preferences::tests::existing_partial_values_preserve_tolerant_decoding_and_dynamic_keys ui_preferences::tests::missing_null_and_wrong_type_blocks_keep_the_original_distinctions
        ui_preferences::tests::unrelated_secret_fields_never_enter_the_read_projection ui_preferences::tests::readers_use_the_supplied_connections_uncommitted_transaction
        ui_preferences::tests::unavailable_storage_reports_only_the_static_read_error

        cargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection
        -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-evidence/desktop-0.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" run "$RUNNER_TEMP/native-evidence/desktop-0.log" settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection

        cargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure
        -- --exact --test-threads=1 2>&1 | tee "$RUNNER_TEMP/native-evidence/desktop-1.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" run "$RUNNER_TEMP/native-evidence/desktop-1.log" settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure

        AI_TOOLBOX_PREFERENCE_READ_ACTOR=1 cargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_registry_actor
        -- --exact --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-evidence/actor-direct.log"

        node "$RUNNER_TEMP/check-ui-preferences.cjs" actor "$RUNNER_TEMP/native-evidence/actor-direct.log" settings::store::tests::narrow_ui_preference_registry_actor

        '
    - name: Verify source and locks unchanged
      if: ${{ !cancelled() }}
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

        test -z "$(git status --porcelain)"

        sha256sum --check "$RUNNER_TEMP/native-evidence/locks.sha256"'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-preferences-read-linux-${{ github.run_id }}
        path: ${{ runner.temp }}/native-evidence
        if-no-files-found: error
        retention-days: 14
  ui-preferences-read-windows:
    needs: ui-preferences-read-linux
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ui-preferences-read-draft-20261031'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: c95f9ec1bc54904ea850a2e2f5b7166db681d6dd
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TERM_COLOR: never
      CARGO_NET_RETRY: '1'
      CARGO_HTTP_TIMEOUT: '60'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: c95f9ec1bc54904ea850a2e2f5b7166db681d6dd
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: dtolnay/rust-toolchain@1.99.1
      with:
        components: rustfmt
    - name: Record source and synthetic Windows environment
      run: "$ErrorActionPreference = 'Stop'\nif ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Source mismatch'\
        \ }\n$evidence = Join-Path $env:RUNNER_TEMP 'native-evidence'\nNew-Item -ItemType Directory -Force $evidence\
        \ | Out-Null\n\"control=$env:GITHUB_SHA\", \"product=$env:SOURCE_SHA\", \"tree=$(git rev-parse 'HEAD^{tree}')\"\
        \ | Set-Content \"$evidence/identity.txt\"\nrustc --version | Set-Content \"$evidence/toolchain.txt\"\n\
        cargo --version | Add-Content \"$evidence/toolchain.txt\"\nGet-PSDrive -PSProvider FileSystem | Out-File\
        \ \"$evidence/disk.txt\"\nGet-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory | Out-File\
        \ \"$evidence/memory.txt\"\n$cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE\
        \ '.cargo' }\n$rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $env:USERPROFILE\
        \ '.rustup' }\n\"CARGO_HOME=$cargoHome\", \"RUSTUP_HOME=$rustupHome\", \"CARGO_TARGET_DIR=$env:RUNNER_TEMP/native-target\"\
        \ | Add-Content $env:GITHUB_ENV\nforeach ($pair in @(@('HOME','home'),@('USERPROFILE','home'),@('APPDATA','config'),@('LOCALAPPDATA','local'),@('AI_TOOLBOX_DATA_DIR','data'),@('AI_TOOLBOX_CACHE_DIR','cache'),@('CODEX_HOME','codex')))\
        \ {\n  $dir = Join-Path $env:RUNNER_TEMP ('native-' + $pair[1])\n  New-Item -ItemType Directory -Force $dir\
        \ | Out-Null\n  \"$($pair[0])=$dir\" | Add-Content $env:GITHUB_ENV\n}\n$locks = @('crates/ai-toolbox-storage/Cargo.lock','crates/ai-toolbox-automation/Cargo.lock','tauri/Cargo.lock')\n\
        $locks | ForEach-Object { \"$((Get-FileHash $_ -Algorithm SHA256).Hash)  $_\" } | Set-Content \"$evidence/locks.sha256\"\
        \n\n# Exact hashes of the reviewed 0b8e83a Git blobs; .gitattributes keeps working-tree LF.\n$baselineLocks\
        \ = @{\n  'crates/ai-toolbox-storage/Cargo.lock' = 'cb14e4cabd3e074917823d8a33a86916540b8d26cbffc6a32cf5020e00ccdaf8'\n\
        \  'crates/ai-toolbox-automation/Cargo.lock' = '5af5cd820a798b3de68b85e63999ca30f827ef7360871b5e7f12570ad67353ea'\n\
        \  'tauri/Cargo.lock' = 'd53be4aa14de37544f99f8bcd665c16b2547d97af00eaedc91a89d285123c1ae'\n}\nforeach ($file\
        \ in $baselineLocks.Keys) {\n  if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $baselineLocks[$file])\
        \ { throw \"Dependency lock differs from reviewed baseline: $file\" }\n}\n$baselineLocks | ConvertTo-Json\
        \ | Set-Content \"$evidence/baseline-locks.json\"\n"
    - name: Verify reviewed tree, parent, exact allowlist and file hashes
      shell: bash
      run: 'node <<''NODE''

        const assert=require(''node:assert/strict''),fs=require(''node:fs''),crypto=require(''node:crypto''),cp=require(''node:child_process'');

        const git=(...args)=>cp.execFileSync(''git'',args,{encoding:''utf8''}).trim();

        const expected={"crates/ai-toolbox-storage/AGENTS.md": "ce196c302372ce354d5420eda282a99c99d81f7a4a3140bb1474e8bb4c17f4c6",
        "crates/ai-toolbox-storage/src/lib.rs": "aab376958f94ebc11136a52fb64089e913c156fb7469bd5d01d0f80a433b93c0",
        "crates/ai-toolbox-storage/src/ui_preferences.rs": "207456254d02f7daf80d5bb2fbb91400f2bd151ba71c4c914fe3372cdda2d28c",
        "crates/ai-toolbox-storage/src/ui_preferences/tests.rs": "261324f3706fef21825f9927d99f7a249ed383a3ae11861561973369c9da519f",
        "tauri/src/settings/AGENTS.md": "47e1f0cc8953839cae950ad03c369982301f5d29dc8e6ae2a3781f7f918ce3e1", "tauri/src/settings/adapter.rs":
        "fbc299d95e877b4e22aae5cae66f192756f42ab3a3a812c27bdc6fe640c6bcc0", "tauri/src/settings/commands.rs": "a9386859f1bb3221182307541da2b4662ec12f5dd21ecbf3156dc4319f09cf08",
        "tauri/src/settings/store.rs": "009d95d4a35567485901614cc93a4c997f244b8e80e9e64e8b5bbef49beece27", "tauri/src/settings/types.rs":
        "33510e949880bd4d88556649f150cf1ff3d5b5b2979b77f6d5685b45ff016909"};

        assert.equal(git(''rev-parse'',''HEAD''),''c95f9ec1bc54904ea850a2e2f5b7166db681d6dd'');

        assert.equal(git(''rev-parse'',''HEAD^{tree}''),''b6bbf47e85d8980610a1a38b43c690df74dcc682'');

        assert.equal(git(''rev-parse'',''HEAD^''),''f5e94d4043c9fa9d255570f21335f2f47e4d2307'');

        assert.equal(git(''rev-parse'',''HEAD^^''),''0b8e83aa2606a81ed7348855ed4acded1a7a377e'');

        assert.deepEqual(git(''diff'',''--name-only'',''0b8e83aa2606a81ed7348855ed4acded1a7a377e'',''HEAD'').split(''\n'').sort(),Object.keys(expected).sort());

        for(const [file,hash] of Object.entries(expected)) assert.equal(crypto.createHash(''sha256'').update(fs.readFileSync(file)).digest(''hex''),hash,file);

        assert.equal(git(''status'',''--porcelain''),'''');

        fs.writeFileSync(process.env.RUNNER_TEMP+''/native-evidence/reviewed-source.json'',JSON.stringify({source:''c95f9ec1bc54904ea850a2e2f5b7166db681d6dd'',tree:''b6bbf47e85d8980610a1a38b43c690df74dcc682'',base:''0b8e83aa2606a81ed7348855ed4acded1a7a377e'',files:expected},null,2));

        console.log(''Reviewed source tree, exact nine-file allowlist and content hashes verified'');

        NODE'
    - name: Prepare exact test-result checker
      run: "@'\nconst fs=require('node:fs'),assert=require('node:assert/strict');\nconst [mode,file,...expected]=process.argv.slice(2);\n\
        const text=fs.readFileSync(file,'utf8').replace(/\\r/g,'');\nif(mode==='list') {\n const found=text.split('\\\
        n').filter(x=>x.endsWith(': test')).map(x=>x.slice(0,-6));\n assert.deepEqual(found.sort(),expected.sort());\n\
        } else {\n const results=[...text.matchAll(/test result: ok\\. (\\d+) passed; (\\d+) failed; (\\d+) ignored;/g)];\n\
        \ assert.equal(results.length,1); assert.equal(+results[0][1],expected.length);\n assert.equal(+results[0][2],0);\
        \ assert.equal(+results[0][3],0);\n for(const name of expected) {\n  if(mode==='actor') { assert(text.includes(`test\
        \ ${name} ... `),name); assert(/^ok$/m.test(text)); }\n  else assert(text.split('\\n').includes(`test ${name}\
        \ ... ok`),name);\n }\n if(mode==='actor') assert(text.includes('synthetic-ui-preferences-registry-restored'));\n\
        }\nconsole.log(JSON.stringify({mode,expected_count:expected.length,names:expected,status:'verified'}));\n\
        '@ | Set-Content -Encoding utf8 \"$env:RUNNER_TEMP/check-ui-preferences.cjs\"\n"
    - name: Require actual selected-source rustfmt success (no source mutation)
      timeout-minutes: 3
      run: '$ErrorActionPreference = ''Stop''

        rustfmt --version | Add-Content "$env:RUNNER_TEMP/native-evidence/toolchain.txt"

        rustfmt --check --edition 2021 --config skip_children=true crates/ai-toolbox-storage/src/lib.rs crates/ai-toolbox-storage/src/ui_preferences.rs
        crates/ai-toolbox-storage/src/ui_preferences/tests.rs tauri/src/settings/types.rs tauri/src/settings/adapter.rs
        tauri/src/settings/store.rs tauri/src/settings/commands.rs 2>&1 | Tee-Object "$env:RUNNER_TEMP/native-evidence/format-check.log"

        if ($LASTEXITCODE -ne 0) { throw ''Actual rustfmt check failed; do not hand-format'' }

        '
      id: format
    - name: Preserve formatting proposal on copies only after format failure
      if: failure() && steps.format.outcome == 'failure'
      shell: bash
      timeout-minutes: 3
      run: 'node <<''NODE''

        const fs=require(''node:fs''),path=require(''node:path''),cp=require(''node:child_process''),assert=require(''node:assert/strict'');

        const evidence=path.join(process.env.RUNNER_TEMP,''native-evidence'');

        const reviewed=JSON.parse(fs.readFileSync(path.join(evidence,''reviewed-source.json''),''utf8''));

        const files=Object.keys(reviewed.files).filter(f=>f.endsWith(''.rs''));

        const output=path.join(evidence,''formatted-source-for-review'');

        for(const file of files) { const dst=path.join(output,file); fs.mkdirSync(path.dirname(dst),{recursive:true});fs.copyFileSync(file,dst);
        }

        const result=cp.spawnSync(''rustfmt'',[''--edition'',''2021'',''--config'',''skip_children=true'',...files.map(f=>path.join(output,f))],{encoding:''utf8''});

        fs.writeFileSync(path.join(evidence,''format-copy.log''),(result.stdout||'''')+(result.stderr||'''')+(result.error?String(result.error):''''));

        fs.writeFileSync(path.join(evidence,''format-status.json''),JSON.stringify({source:reviewed.source,check:''failed'',copy_format_exit:result.status,compiled:false,rust_tests:''not
        run'',outputs:''review only; never tested as original source''},null,2));

        assert.equal(cp.execFileSync(''git'',[''status'',''--porcelain''],{encoding:''utf8''}).trim(),'''');

        if(result.error || result.status!==0) process.exit(1);

        NODE'
    - name: Compile fixed source and verify six shared plus two desktop regressions and recovery actor
      timeout-minutes: 65
      run: "$ErrorActionPreference = 'Stop'\ncargo test --locked --manifest-path crates/ai-toolbox-storage/Cargo.toml\
        \ --lib ui_preferences::tests:: -- --list 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/shared-selection.log\"\
        \nif ($LASTEXITCODE -ne 0) { throw 'Test listing failed' }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\"\
        \ list \"$env:RUNNER_TEMP/native-evidence/shared-selection.log\" ui_preferences::tests::missing_record_reads_defaults_without_creating_or_writing\
        \ ui_preferences::tests::existing_partial_values_preserve_tolerant_decoding_and_dynamic_keys ui_preferences::tests::missing_null_and_wrong_type_blocks_keep_the_original_distinctions\
        \ ui_preferences::tests::unrelated_secret_fields_never_enter_the_read_projection ui_preferences::tests::readers_use_the_supplied_connections_uncommitted_transaction\
        \ ui_preferences::tests::unavailable_storage_reports_only_the_static_read_error\nif ($LASTEXITCODE -ne 0)\
        \ { throw 'Exact selection mismatch' }\ncargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_\
        \ -- --list 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/desktop-selection.log\"\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Test listing failed' }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\" list \"$env:RUNNER_TEMP/native-evidence/desktop-selection.log\"\
        \ settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure\
        \ settings::store::tests::narrow_ui_preference_registry_actor\nif ($LASTEXITCODE -ne 0) { throw 'Exact selection\
        \ mismatch' }\ncargo test --locked --manifest-path crates/ai-toolbox-storage/Cargo.toml --lib ui_preferences::tests::\
        \ -- --test-threads=1 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/shared-run.log\"\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Shared tests failed' }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\" run \"$env:RUNNER_TEMP/native-evidence/shared-run.log\"\
        \ ui_preferences::tests::missing_record_reads_defaults_without_creating_or_writing ui_preferences::tests::existing_partial_values_preserve_tolerant_decoding_and_dynamic_keys\
        \ ui_preferences::tests::missing_null_and_wrong_type_blocks_keep_the_original_distinctions ui_preferences::tests::unrelated_secret_fields_never_enter_the_read_projection\
        \ ui_preferences::tests::readers_use_the_supplied_connections_uncommitted_transaction ui_preferences::tests::unavailable_storage_reports_only_the_static_read_error\n\
        if ($LASTEXITCODE -ne 0) { throw 'Shared result mismatch' }\ncargo test --locked --manifest-path tauri/Cargo.toml\
        \ --lib settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection -- --exact\
        \ --test-threads=1 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/desktop-0.log\"\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Desktop regression failed' }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\" run \"\
        $env:RUNNER_TEMP/native-evidence/desktop-0.log\" settings::store::tests::narrow_ui_preference_wrappers_match_the_full_adapter_projection\n\
        if ($LASTEXITCODE -ne 0) { throw 'Desktop result mismatch' }\ncargo test --locked --manifest-path tauri/Cargo.toml\
        \ --lib settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure\
        \ -- --exact --test-threads=1 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/desktop-1.log\"\nif ($LASTEXITCODE\
        \ -ne 0) { throw 'Desktop regression failed' }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\" run \"\
        $env:RUNNER_TEMP/native-evidence/desktop-1.log\" settings::store::tests::narrow_ui_preference_reads_restore_manual_cli_overrides_after_read_failure\n\
        if ($LASTEXITCODE -ne 0) { throw 'Desktop result mismatch' }\n$env:AI_TOOLBOX_PREFERENCE_READ_ACTOR = '1'\n\
        try {\n  cargo test --locked --manifest-path tauri/Cargo.toml --lib settings::store::tests::narrow_ui_preference_registry_actor\
        \ -- --exact --test-threads=1 --nocapture 2>&1 | Tee-Object \"$env:RUNNER_TEMP/native-evidence/actor-direct.log\"\
        \n  if ($LASTEXITCODE -ne 0) { throw 'Recovery actor failed' }\n} finally { Remove-Item Env:AI_TOOLBOX_PREFERENCE_READ_ACTOR\
        \ -ErrorAction SilentlyContinue }\nnode \"$env:RUNNER_TEMP/check-ui-preferences.cjs\" actor \"$env:RUNNER_TEMP/native-evidence/actor-direct.log\"\
        \ settings::store::tests::narrow_ui_preference_registry_actor\nif ($LASTEXITCODE -ne 0) { throw 'Actor evidence\
        \ mismatch' }\n"
    - name: Verify source and locks unchanged
      if: ${{ !cancelled() }}
      run: "$ErrorActionPreference = 'Stop'\nif ((git rev-parse HEAD) -ne $env:SOURCE_SHA -or (git status --porcelain))\
        \ { throw 'Source changed' }\nforeach ($line in Get-Content \"$env:RUNNER_TEMP/native-evidence/locks.sha256\"\
        ) {\n  $parts = $line -split '  ',2\n  if ((Get-FileHash $parts[1] -Algorithm SHA256).Hash -ne $parts[0])\
        \ { throw 'Lock changed' }\n}\n"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-preferences-read-windows-${{ github.run_id }}
        path: ${{ runner.temp }}/native-evidence
        if-no-files-found: error
        retention-days: 14
