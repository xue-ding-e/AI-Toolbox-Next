name: Isolated SSH Chinese representative visual supplement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  visual:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/ssh-capability-visual'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 459b34a65039d93209c02efe10985d91b3caeda2
          path: source
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Verify reviewed visual harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'e1eff0a594ffb54f8bdd1a0789441e1375e1a4c3e1e9ab19a990e2d0edb44ded  validation/candidate.diff' | sha256sum -c -
          echo '8e8e081ee9dbcc9cc5710442277a8202e6682cc0fa3557d02f332b279801498b  validation/visual-manifest.json' | sha256sum -c -
          echo 'd0b59c8c1ae8eeb8e6f35ca026f2af4053e556bd23f90b806247206733e55589  validation/visual-validate.py' | sha256sum -c -
      - name: Official distribution CJK fonts only
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          node --version
          pnpm --version
          google-chrome --version
      - name: Two real Chinese representative cases only
        timeout-minutes: 14
        run: python3 harness/validation/visual-validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ssh-capability-visual-evidence
          path: |
            ${{ runner.temp }}/ssh-capability-visual-evidence/*.json
            ${{ runner.temp }}/ssh-capability-visual-evidence/*.log
            ${{ runner.temp }}/ssh-capability-visual-evidence/*.diff
            ${{ runner.temp }}/ssh-capability-visual-evidence/visual/*/*.json
            ${{ runner.temp }}/ssh-capability-visual-evidence/visual/*/capability-*.png
            ${{ runner.temp }}/ssh-capability-visual-evidence/visual/*/capability-*.html
            ${{ runner.temp }}/ssh-capability-visual-evidence/visual/*/failure.png
            ${{ runner.temp }}/ssh-capability-visual-evidence/visual/*/failure.html
          retention-days: 7
