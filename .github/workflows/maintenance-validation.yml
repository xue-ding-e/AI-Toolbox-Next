name: Isolated Claude Desktop routing Rust verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  desktop:
    if: github.repository == 'xue-ding-e/AI-Toolbox-Next' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/validation/claude-desktop-routing'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/tauri/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1e147f9c32f33bef8652f08a049f001d5f920eca
          path: source
          persist-credentials: false
      - name: Verify reviewed harness hashes
        working-directory: harness
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          echo 'c5fa8e269b30cb52b84800e2030148e9ce62f972c2dbd93d924b7def65d32943  validation/candidate.diff' | sha256sum -c -
          echo 'd976fdd81fc20ab0caaad16fe61f9290d2cc307f158bc6b9b67df2ea4e5bd271  validation/manifest.json' | sha256sum -c -
          echo '24fdecfd65c7af2bf047fbd9c58770749632d70e55721e1cc6fffedf622695e4  validation/validate.py' | sha256sum -c -
      - name: Official prerequisites and fixed Rust
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev
          rustup toolchain install 1.99.1 --profile minimal
      - name: Exact production compilation and 19 serial Rust tests
        timeout-minutes: 28
        run: python3 harness/validation/validate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: desktop-routing-evidence
          path: |
            ${{ runner.temp }}/desktop-routing-evidence/*.log
            ${{ runner.temp }}/desktop-routing-evidence/*.json
            ${{ runner.temp }}/desktop-routing-evidence/*.diff
            ${{ runner.temp }}/desktop-routing-evidence/*/*/*.json
            ${{ runner.temp }}/desktop-routing-evidence/*/*/failure.html
            ${{ runner.temp }}/desktop-routing-evidence/*/*/failure.png
            ${{ runner.temp }}/desktop-routing-evidence/*/*/case-*-failure.html
            ${{ runner.temp }}/desktop-routing-evidence/*/*/case-*-failure.png
            ${{ runner.temp }}/desktop-routing-evidence/*/*/desktop-routing-*.png
          retention-days: 7
