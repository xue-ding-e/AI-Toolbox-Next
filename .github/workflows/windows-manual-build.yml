name: Next Windows manual build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-toolbox-maintenance-validation
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Verify Next-only unsigned manual distribution
        shell: pwsh
        run: |
          $config = Get-Content tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.identifier -ne 'com.xue-ding-e.ai-toolbox-next') { throw 'Unexpected installer identity' }
          if ($config.bundle.createUpdaterArtifacts -ne $false) { throw 'Updater artifacts must remain disabled' }
          if ($config.plugins.updater) { throw 'Manual build must not have an updater channel' }
          if ($config.plugins.'deep-link'.desktop.schemes -contains 'aitoolbox') { throw 'Must not claim upstream URL protocol' }
      # Artifact-only. Root release acceptance separately requires sealed Linux tests
      # for this exact github.sha; this workflow alone never authorizes publication.
      # No signing secret, release action, package-manager update, or Rust target cache.
      - run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - name: Prepare versioned Windows installer and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          New-Item -ItemType Directory release-assets | Out-Null
          $name = "AI-Toolbox-Next_${version}_windows-x64-setup.exe"
          Copy-Item $installers[0].FullName "release-assets/$name"
          $hash = (Get-FileHash "release-assets/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content release-assets/SHA256SUMS -Encoding ascii
          @{ version = $version; source_commit = $env:GITHUB_SHA; repository = $env:GITHUB_REPOSITORY; signed = $false; update_mode = 'manual' } | ConvertTo-Json | Set-Content release-assets/build-provenance.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: next-windows-x64-candidate-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14
